    <script>
        // --- CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyBqGx_Skjp_RKxIK-pHRGOlp22uLJdy6WE",
            authDomain: "my-app-hub-69db8.web.app",
            projectId: "my-app-hub-69db8",

            appId: "1:709494807607:web:e8cdafc2511ab6e354b3b2",
            measurementId: "G-KWWNJDP8LY"
        };
        Object.freeze(firebaseConfig);

        // --- APP CORE ENGINE ---
        class AppCore {
            constructor() {
                this.user = null;
                this.db = null;
                this.auth = null;
                this.globalState = {
                    theme: 'light',
                    notifications: 0,
                    lastActive: null,
                    globalNote: ''
                };
                this.stateListeners = [];
            }

            async init() {
                if (typeof firebase === 'undefined') return;
                if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                this.auth = firebase.auth();
                this.db = firebase.firestore();

                try {
                    await this.db.enablePersistence();
                    console.log("🔌 Offline mode enabled");
                } catch (err) {
                    console.log("Persistence disabled:", err.code);
                }

                this.injectStyles();
                // Finish a Google sign-in that redirected away and back - see
                // signInWithGoogle()/completeGoogleRedirect() below.
                await this.completeGoogleRedirect();
                this.setupAuth();
            }

            setupAuth() {
                this.auth.onAuthStateChanged(user => {
                    this.user = user;
                    if (user) {
                        this.connectGlobalStore();
                        this.renderNav(); 
                    } else {
                        this.renderNav();
                    }
                });
            }

            connectGlobalStore() {
                if (!this.user) return;
                this.db.collection('users').doc(this.user.uid).collection('app_data').doc('global_store')
                    .onSnapshot(doc => {
                        if (doc.exists) {
                            this.globalState = { ...this.globalState, ...doc.data() };
                            this.notifyListeners();
                            this.applyTheme(this.globalState.theme);
                        } else {
                            this.updateGlobalStore({ theme: 'light', created: Date.now() });
                        }
                    });
            }

            async updateGlobalStore(data) {
                if (!this.user) return;
                try {
                    await this.db.collection('users').doc(this.user.uid).collection('app_data').doc('global_store').set(
                        { ...data, lastUpdated: firebase.firestore.FieldValue.serverTimestamp() },
                        { merge: true }
                    );
                } catch (e) {
                    console.error("Sync Error:", e);
                }
            }

            subscribe(callback) {
                this.stateListeners.push(callback);
                callback(this.globalState);
            }

            notifyListeners() {
                this.stateListeners.forEach(cb => cb(this.globalState));
            }

            injectStyles() {
                if(typeof tailwind !== 'undefined') {
                    tailwind.config = {
                        darkMode: 'class',
                        theme: { extend: { fontFamily: { sans: ['Instrument Sans', 'sans-serif'] } } }
                    }
                }
            }

            applyTheme(theme) {
                if (theme === 'dark') document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }

            toggleTheme() {
                const newTheme = this.globalState.theme === 'dark' ? 'light' : 'dark';
                this.updateGlobalStore({ theme: newTheme });
            }

            // --- 🔐 GOOGLE SIGN-IN ---
            // Popup first, redirect second. On an iOS Home Screen web app a full-page
            // redirect hands the navigation off to Safari and never returns, so
            // getRedirectResult() would resolve null forever and the user would appear
            // permanently signed out. The popup stays inside this app's own context.
            // Redirect remains the fallback for webviews that block popups.
            async signInWithGoogle() {
                const provider = new firebase.auth.GoogleAuthProvider();
                try {
                    await this.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
                } catch (e) {
                    console.log('Auth persistence:', e.code || e.message);
                }
                // A standalone (Home Screen) web app has no browser window
                // chrome to host a popup - signInWithPopup silently fails or
                // hangs there instead of throwing something the fallback
                // below could react to, so skip straight to redirect.
                const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
                if (!standalone) {
                    try {
                        await this.auth.signInWithPopup(provider);
                        return;
                    } catch (e) {
                        if (e.code === 'auth/account-exists-with-different-credential') {
                            await this.linkPendingCredential(e);
                            return;
                        }
                        // Closing the popup is a deliberate cancel, not a reason to fall
                        // back to a redirect the user did not ask for.
                        if (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') return;
                        console.log('Popup sign-in unavailable, using redirect:', e.code || e.message);
                    }
                }
                try {
                    await this.auth.signInWithRedirect(provider);
                } catch (e) {
                    alert('Could not start Google sign-in: ' + e.message);
                }
            }

            // Handles the return trip from a redirect sign-in. A failure here used to be
            // swallowed into console.log, which made a broken redirect completely
            // invisible - the symptom that hid the iOS problem for so long.
            async completeGoogleRedirect() {
                const BENIGN = ['auth/no-auth-event', 'auth/popup-closed-by-user', 'auth/cancelled-popup-request'];
                try {
                    await this.auth.getRedirectResult();
                } catch (e) {
                    if (e.code === 'auth/account-exists-with-different-credential') {
                        await this.linkPendingCredential(e);
                    } else if (e.code && BENIGN.indexOf(e.code) === -1) {
                        console.log('Google sign-in:', e.code);
                        alert('Google sign-in did not complete: ' + (e.message || e.code));
                    }
                }
            }

            // One-time account link: this Google account's email already has a password
            // account, and Firebase refuses to silently merge the two. Linking once the
            // existing password is confirmed keeps the original uid - and every case
            // saved under it - intact. Shared by both the popup and redirect paths.
            async linkPendingCredential(e) {
                const email = e.email;
                const pendingCred = e.credential;
                const methods = email ? await this.auth.fetchSignInMethodsForEmail(email) : [];
                if (!methods.includes('password')) {
                    alert('Sign-in failed: ' + e.message);
                    return;
                }
                const password = prompt(
                    'You already have an account for ' + email + ' signed in with a password.\n' +
                    'Enter that password once to link Google sign-in to it:'
                );
                if (!password) return;
                try {
                    const cred = await this.auth.signInWithEmailAndPassword(email, password);
                    await cred.user.linkWithCredential(pendingCred);
                } catch (linkErr) {
                    alert('Could not link Google sign-in: ' + linkErr.message);
                }
            }

            renderNav() {
                const navContainer = document.getElementById('global-nav');
                if (!navContainer) return;

                const email = this.user ? (this.user.email || 'Anonymous') : 'Not Logged In';
                const avatar = email.charAt(0).toUpperCase();

                navContainer.innerHTML = `
                    <nav class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 sticky top-0 z-50">
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                            <a href="index.html" class="flex items-center gap-2 font-bold text-xl text-slate-800 dark:text-white hover:opacity-80 transition">
                                <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white">A</div>
                                <span>App Hub</span>
                            </a>

                            <div class="flex items-center gap-4">
                                <div id="global-status" class="hidden md:flex text-xs px-2 py-1 rounded bg-slate-100 dark:bg-slate-800 text-slate-500">
                                    ${this.user ? '🟢 Synced' : '⚪ Offline'}
                                </div>

                                <button onclick="window.Core.toggleTheme()" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                                    ${this.globalState.theme === 'dark' ? '🌙' : '☀️'}
                                </button>

                                ${this.user ? `
                                <div class="relative group cursor-pointer">
                                    <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-blue-500 to-purple-500 text-white flex items-center justify-center font-bold shadow-sm">
                                        ${avatar}
                                    </div>
                                    <div class="absolute right-0 mt-2 w-48 bg-white dark:bg-slate-800 rounded-xl shadow-xl border border-slate-200 dark:border-slate-700 py-1 hidden group-hover:block">
                                        <div class="px-4 py-2 border-b border-slate-200 dark:border-slate-700">
                                            <p class="text-xs text-slate-500">Signed in as</p>
                                            <p class="text-sm font-medium truncate text-slate-900 dark:text-slate-100">${email}</p>
                                        </div>
                                        <button onclick="firebase.auth().signOut()" class="w-full text-left px-4 py-2 text-sm text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20">Sign Out</button>
                                    </div>
                                </div>
                                ` : `
                                <button onclick="Core.signInWithGoogle()" class="flex items-center gap-2 pl-2 pr-3 py-1.5 rounded-lg text-sm font-semibold bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 transition shadow-sm">
                                    <svg width="16" height="16" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.09-1.8 2.73v2.27h2.92c1.7-1.57 2.68-3.88 2.68-6.64z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.17l-2.92-2.27c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.71H.96v2.34C2.44 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.97 10.71c-.18-.54-.28-1.11-.28-1.71s.1-1.17.28-1.71V4.95H.96C.35 6.17 0 7.55 0 9s.35 2.83.96 4.05l3.01-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.59-2.59C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.95l3.01 2.34C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
                                    <span class="text-slate-700 dark:text-slate-200">Sign in</span>
                                </button>
                                `}
                            </div>
                        </div>
                    </nav>
                `;
            }
        }

        // Initialize Global Instance
        window.Core = new AppCore();
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => window.Core.init());
        } else {
            window.Core.init();
        }
    </script>

            X: () => <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
        };

        const LatEng = window.LatEng;
        const LatData = window.LatData;
        const LS_KEY = "lva_tool_state";

        // --- DEFAULT STATE, BUILT FROM lateral-checklist.js ---
        function keyByArrayId(arr) {
            const out = {};
            arr.forEach(sec => { out[sec.id] = JSON.parse(JSON.stringify(sec)); });
            return out;
        }

        function defaultCalc(template) {
            return {
                sm: { Nc: "", N1: "", N2: "", Nref: "", position: "below" },
                unbalance: { W: "", N: "", multiplier: "2", cap: template === "gear" ? "25.4" : "50.8" },
                clearance: { Ao: "", minClearance: "" },
                mesh: { N: "", teeth: "", critical1: "", critical2: "" },
                stability: { Nmc: "", Nc1: "", Q0: "", logDec: "", stages: [{ P: "", D: "", H: "", N: "", B: "3" }] }
            };
        }

        // --- TRAIN LATERAL APPLICABILITY (API 684 Fig 2-9) ---
        // Train-level, so it sits beside `shared` rather than under any rotor.
        // The coupling rows come from a train-type preset but stay editable.
        function couplingRowsFor(trainTypeKey) {
            const preset = LatData.TRAIN_TYPES.find(t => t.key === trainTypeKey) || LatData.TRAIN_TYPES[0];
            return preset.couplings.map((c, i) => ({
                id: `cpl_${preset.key}_${i}`,
                label: c.label,
                type: "flexible_spacer",
                Ncr: "", Nmcos: "",
                driverLabel: c.driverLabel, driverW: "", driverWjnl: "",
                drivenLabel: c.drivenLabel, drivenW: "", drivenWjnl: ""
            }));
        }

        function defaultTrainLateral() {
            const trainType = LatData.TRAIN_TYPES[0].key;
            // adnocStash keeps the status/notes of ADNOC check points while the
            // customer specification is switched off, so toggling back does not
            // discard a reviewer's work.
            return { trainType, customerSpec: "none", adnocFloor: "2.0", adnocStash: {}, couplings: couplingRowsFor(trainType) };
        }

        // Shape the stored coupling rows into the engine's input contract:
        // one ratio per coupling, one (Whalf, Wjnl) pair per shaft end.
        function trainLateralInput(tl) {
            return (tl.couplings || []).map(c => ({
                id: c.id,
                label: c.label,
                couplingType: c.type,
                NcrSpacer: num(c.Ncr),
                Nmcos: num(c.Nmcos),
                ends: [
                    { key: "driver", label: c.driverLabel, Whalf: num(c.driverW), Wjnl: num(c.driverWjnl) },
                    { key: "driven", label: c.drivenLabel, Whalf: num(c.drivenW), Wjnl: num(c.drivenWjnl) }
                ]
            }));
        }

        // One place that decides how the stored panel settings become engine
        // arguments, so the on-screen panel, the PDF and the Excel sheet can
        // never disagree about the verdict.
        function runTrainLateralScreen(tl) {
            const adnoc = tl.customerSpec === "adnoc";
            const preset = LatData.TRAIN_TYPES.find(t => t.key === tl.trainType);
            return LatEng.trainLateralScreen({
                couplings: trainLateralInput(tl),
                floor: adnoc ? (num(tl.adnocFloor) || null) : null,
                geared: !!(preset && preset.geared),
                customerSpec: tl.customerSpec || "none"
            });
        }

        function buildDefaultState() {
            const rotors = {};
            LatData.ROTORS.forEach(r => {
                rotors[r.key] = {
                    label: r.label,
                    template: r.template,
                    calc: defaultCalc(r.template),
                    sections: keyByArrayId(LatData.ROTOR_TEMPLATES[r.template])
                };
            });
            return {
                project: { ...LatData.PROJECT_DEFAULTS },
                shared: JSON.parse(JSON.stringify(LatData.SHARED_SECTIONS)),
                trainLateral: defaultTrainLateral(),
                rotors
            };
        }

        // Defensive merge: fills anything missing from a loaded/imported
        // document with fresh defaults, so the corpus can grow over time
        // without breaking a document saved against an older version of it.
        function mergeWithDefaults(loaded) {
            const def = buildDefaultState();
            if (!loaded || typeof loaded !== "object") return def;
            const loadedTL = (loaded.trainLateral && typeof loaded.trainLateral === "object") ? loaded.trainLateral : {};
            const merged = {
                project: { ...def.project, ...(loaded.project || {}) },
                shared: { ...def.shared, ...(loaded.shared || {}) },
                trainLateral: {
                    ...def.trainLateral,
                    ...loadedTL,
                    // A document saved before this panel existed has no coupling
                    // rows at all — fall back to the default preset rather than
                    // rendering an empty screen.
                    couplings: (Array.isArray(loadedTL.couplings) && loadedTL.couplings.length)
                        ? loadedTL.couplings : def.trainLateral.couplings
                },
                rotors: {}
            };
            Object.keys(def.rotors).forEach(key => {
                const loadedRotor = (loaded.rotors && loaded.rotors[key]) || {};
                merged.rotors[key] = {
                    label: def.rotors[key].label,
                    template: def.rotors[key].template,
                    calc: { ...def.rotors[key].calc, ...(loadedRotor.calc || {}) },
                    sections: { ...def.rotors[key].sections, ...(loadedRotor.sections || {}) }
                };
            });
            return merged;
        }

        function loadInitialState() {
            try {
                const raw = localStorage.getItem(LS_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (parsed && parsed.project && parsed.shared && parsed.rotors) return mergeWithDefaults(parsed);
                }
            } catch (e) { /* ignore corrupt/blocked storage */ }
            return buildDefaultState();
        }

        // --- SAMPLE DATA ---
        // A worked, physically-consistent example train, so the calculators
        // and every new chart render something meaningful without hand-typing
        // every field. Deliberately includes one FAIL (gearbox HS/pinion
        // separation margin) and one flagged stability screen (compressor),
        // so the red/amber states are visible immediately, not just green.
        const SAMPLE_PROJECT = {
            endCustomer: "Example Energy Co.",
            project: "Gulf Coast LNG Train 3 Expansion",
            specifications: "API 617 8th Ed / API 684 2nd Ed, Purchaser Spec ENG-617-04",
            service: "Recycle / Sendout Compressor",
            manufacturer: "Elliott Group",
            model: "49MB8 Barrel Compressor + 78MB Increaser + 5000 HP Induction Motor"
        };
        // Bull gear (87T) at 3600 rpm and pinion (29T) at 10800 rpm mesh at the
        // same 5220 Hz, matching a 3600 -> 10800 rpm (3.0x) speed increase.
        const SAMPLE_CALC = {
            motor: {
                sm: { Nc: "1450", N1: "1400", N2: "1510", Nref: "3200", position: "below" },
                unbalance: { W: "180", N: "3600", multiplier: "2", cap: "50.8" },
                clearance: { Ao: "45", minClearance: "90" },
                mesh: { N: "", teeth: "", critical1: "", critical2: "" },
                stability: { Nmc: "", Nc1: "", Q0: "", logDec: "", stages: [{ P: "", D: "", H: "", N: "", B: "3" }] }
            },
            gear_ls: {
                sm: { Nc: "1600", N1: "1540", N2: "1680", Nref: "3400", position: "below" },
                unbalance: { W: "220", N: "3600", multiplier: "2", cap: "25.4" },
                clearance: { Ao: "20", minClearance: "60" },
                mesh: { N: "3600", teeth: "87", critical1: "", critical2: "" },
                stability: { Nmc: "", Nc1: "", Q0: "", logDec: "", stages: [{ P: "", D: "", H: "", N: "", B: "3" }] }
            },
            gear_hs: {
                sm: { Nc: "9200", N1: "9050", N2: "9380", Nref: "10000", position: "below" },
                unbalance: { W: "95", N: "10800", multiplier: "2", cap: "25.4" },
                clearance: { Ao: "15", minClearance: "40" },
                mesh: { N: "10800", teeth: "29", critical1: "4900", critical2: "6800" },
                stability: { Nmc: "", Nc1: "", Q0: "", logDec: "", stages: [{ P: "", D: "", H: "", N: "", B: "3" }] }
            },
            comp: {
                sm: { Nc: "7200", N1: "7050", N2: "7370", Nref: "10000", position: "below" },
                unbalance: { W: "140", N: "10800", multiplier: "2", cap: "50.8" },
                clearance: { Ao: "55", minClearance: "100" },
                mesh: { N: "", teeth: "", critical1: "", critical2: "" },
                stability: {
                    Nmc: "10800", Nc1: "7200", Q0: "19000", logDec: "0.15",
                    stages: [
                        { P: "1200", D: "350", H: "3.5", N: "10800", B: "3" },
                        { P: "1100", D: "330", H: "3.3", N: "10800", B: "3" },
                        { P: "1000", D: "310", H: "3.1", N: "10800", B: "3" },
                        { P: "900", D: "290", H: "2.9", N: "10800", B: "3" }
                    ]
                }
            }
        };
        // Screen values consistent with the sample train above: the LS coupling
        // (3600 rpm shaft) clears the Figure 2-9 line, the HS coupling
        // (10800 rpm shaft) does not — so the chart shows both states at once.
        const SAMPLE_TRAIN_LATERAL = {
            trainType: "motor_gear_comp",
            customerSpec: "none",
            adnocFloor: "2.0",
            couplings: [
                {
                    id: "cpl_motor_gear_comp_0", label: "Motor \u2192 Bull Gear (LS)", type: "flexible_spacer",
                    Ncr: "9000", Nmcos: "3600",
                    driverLabel: "Motor", driverW: "22", driverWjnl: "180",
                    drivenLabel: "Bull Gear (LS)", drivenW: "22", drivenWjnl: "220"
                },
                {
                    id: "cpl_motor_gear_comp_1", label: "Pinion (HS) \u2192 Compressor", type: "flexible_spacer",
                    Ncr: "20000", Nmcos: "10800",
                    driverLabel: "Pinion (HS)", driverW: "18", driverWjnl: "95",
                    drivenLabel: "Compressor", drivenW: "18", drivenWjnl: "140"
                }
            ]
        };
        // Items forced to "deviation" so they match the calculator's FAIL/
        // flagged cases above, keyed by scope ("shared" or a rotor key) then
        // section id, each with an explanatory note.
        const SAMPLE_DEVIATIONS = {
            shared: { foundation: ["sh-f3"], coupling: ["sh-c4"], trainlat: ["tl-1"] },
            gear_hs: { D: ["d4"], E: ["ge2"] },
            comp: { E: ["ce3"] }
        };
        const SAMPLE_NOTES = {
            "sh-f3": "Impact/structural resonance test report not yet received from the EPC civil contractor; requested before FAT.",
            "tl-1": "Vendor's report states a train lateral analysis is 'not required' with no supporting screen. The Figure 2-9 plot above puts both ends of the pinion/compressor coupling below the line (Ncr(spacer)/Nmcos = 1.85 vs. 2.00 required) — a coupled train lateral analysis has been requested.",
            "sh-c4": "Solo-run moment simulator plate omitted from the vendor BOM; flagged to procurement for an add-on.",
            "d4": "Vendor's actual SM at the 1st critical is ~8%, short of the 16% required at AF≈28 — see the Criteria Calculator above. Requested a revised bearing design or a damped response re-run.",
            "ge2": "A nearby lateral critical at ~4900 Hz sits within 6% of the 1× mesh frequency (5220 Hz) — see the chart above. Vendor asked to confirm damping at this crossing.",
            "ce3": "Q0/QA = 1.75, short of the commonly used 2× margin. Level II stability analysis requested per Annex E."
        };
        function hashStr(s) {
            let h = 0;
            for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
            return h;
        }
        function seedSampleStatus(sectionsObj, scopeKey) {
            const next = JSON.parse(JSON.stringify(sectionsObj));
            const forced = SAMPLE_DEVIATIONS[scopeKey] || {};
            Object.entries(next).forEach(([secKey, sec]) => {
                const forcedIds = forced[secKey] || [];
                sec.items.forEach(item => {
                    if (forcedIds.includes(item.id)) {
                        item.status = "deviation"; item.checked = false; item.notes = SAMPLE_NOTES[item.id] || "";
                    } else if (hashStr(item.id) % 100 < 58) {
                        item.status = "compliant"; item.checked = true;
                    } else {
                        item.status = "pending"; item.checked = false;
                    }
                });
            });
            return next;
        }
        function buildSampleData() {
            const base = buildDefaultState();
            const rotors = {};
            LatData.ROTORS.forEach(r => {
                rotors[r.key] = {
                    label: base.rotors[r.key].label,
                    template: base.rotors[r.key].template,
                    calc: SAMPLE_CALC[r.key],
                    sections: seedSampleStatus(base.rotors[r.key].sections, r.key)
                };
            });
            return {
                project: { ...SAMPLE_PROJECT, configuration: base.project.configuration },
                shared: seedSampleStatus(base.shared, "shared"),
                trainLateral: JSON.parse(JSON.stringify(SAMPLE_TRAIN_LATERAL)),
                rotors
            };
        }

        function debounce(func, wait) {
            let timeout;
            return function (...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), wait);
            };
        }

        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay backdrop-blur-sm">
                    <div className="bg-white rounded-xl shadow-2xl w-full max-w-md border border-slate-200 animate-[fadeIn_0.2s_ease-out]">
                        <div className="flex justify-between items-center p-4 border-b border-slate-100">
                            <h3 className="text-lg font-bold text-slate-800">{title}</h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600 transition-colors"><Icons.X /></button>
                        </div>
                        <div className="p-4">{children}</div>
                    </div>
                </div>
            );
        };

        // --- CRITERIA CALCULATOR PIECES ---
        const NumField = ({ label, unit, value, onChange, placeholder, step = "any" }) => (
            <label className="block">
                <span className="block text-xs font-medium text-slate-500 mb-1">{label}{unit ? <span className="text-slate-400"> ({unit})</span> : null}</span>
                <input type="number" step={step} value={value} placeholder={placeholder}
                    onChange={e => onChange(e.target.value)}
                    className="w-full text-sm p-2 border border-slate-300 rounded focus:ring-1 focus:ring-blue-500 outline-none" />
            </label>
        );

        const ResultRow = ({ label, r }) => {
            if (!r) return <p className="text-xs text-slate-400 italic py-1">{label}: enter values above to compute.</p>;
            return (
                <div className="py-2 border-b border-slate-100 last:border-0">
                    <div className="flex items-center justify-between gap-2">
                        <span className="text-sm font-semibold text-slate-700">{label}</span>
                        {(r.pass === true || r.pass === false) && (
                            <span className={`text-xs font-bold uppercase px-2 py-0.5 rounded ${r.pass ? "bg-green-100 text-green-700" : "bg-red-100 text-red-700"}`}>{r.pass ? "Pass" : "Fail"}</span>
                        )}
                    </div>
                    <div className="text-sm font-mono text-slate-900 mt-0.5">
                        {typeof r.value === "number" ? r.value.toFixed(2) : r.value} {r.unit}
                        {r.us != null && <span className="text-slate-400">  ({typeof r.us === "number" ? r.us.toFixed(3) : r.us} {r.usUnit})</span>}
                    </div>
                    {r.basis && <div className="text-xs text-slate-400 mt-1">{r.basis}</div>}
                </div>
            );
        };

        const num = (v) => { const n = parseFloat(v); return isNaN(n) ? null : n; };

        // --- SVG CHART COMPONENTS ---
        // Chart ink follows the app's own Tailwind palette (blue-600 accent,
        // slate ink/gridlines, green/red/amber status) rather than a separate
        // chart palette, so calculator charts read as part of this tool, not
        // a bolted-on library. Marks: 2px lines, r>=4 markers with a 2px white
        // ring, hairline (1px) solid gridlines, ~10% opacity area washes.
        const CHART_INK = { primary: "#0f172a", secondary: "#475569", muted: "#94a3b8", grid: "#e2e8f0" };
        const CHART_STATUS = { good: "#16a34a", goodWash: "#dcfce7", bad: "#dc2626", badWash: "#fee2e2", warn: "#d97706", warnWash: "#fef3c7", accent: "#2563eb", accentWash: "#dbeafe" };

        // A horizontal rect path rounded only on its "data end" (right edge),
        // square at the baseline (left edge) — per mark spec.
        function roundedBarPath(x0, y0, w, h, r) {
            if (w <= 0) return "";
            const rr = Math.min(r, w, h / 2);
            if (rr <= 0.5) return `M${x0},${y0} h${w} v${h} h${-w} Z`;
            return `M${x0},${y0} H${x0 + w - rr} A${rr},${rr} 0 0 1 ${x0 + w},${y0 + rr} V${y0 + h - rr} A${rr},${rr} 0 0 1 ${x0 + w - rr},${y0 + h} H${x0} Z`;
        }

        // Illustrative single-DOF resonance shape driven by the entered AF —
        // not a measured response curve. Visualizes the SM calculator inputs.
        const ResponseCurveChart = ({ Nc, N1, N2, Nref, position, pass }) => {
            if (!(Nc > 0 && N1 != null && N2 != null && Nref > 0)) return null;
            const w = Math.max(1, (N2 - N1) / 2);
            const xMin = Math.min(N1, Nref, Nc - 4 * w) * 0.97;
            const xMax = Math.max(N2, Nref, Nc + 4 * w) * 1.03;
            const W = 600, H = 190, padL = 46, padR = 14, padT = 16, plotW = W - padL - padR, baseY = 150, topY = padT;
            const sx = (x) => padL + ((x - xMin) / (xMax - xMin)) * plotW;
            const sy = (a) => baseY - (a / 1.05) * (baseY - topY);
            const N = 70;
            let d = "";
            for (let i = 0; i <= N; i++) {
                const x = xMin + (i / N) * (xMax - xMin);
                const a = 1 / Math.sqrt(1 + Math.pow((x - Nc) / w, 2));
                d += (i === 0 ? "M" : "L") + sx(x).toFixed(1) + "," + sy(a).toFixed(1) + " ";
            }
            const zoneX1 = sx(Math.min(Nref, Nc)), zoneX2 = sx(Math.max(Nref, Nc));
            const zoneColor = pass ? CHART_STATUS.goodWash : CHART_STATUS.badWash;
            const refLabel = position === "above" ? "Ntrip" : "Nmin";
            return (
                <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto" role="img" aria-label="Illustrative resonance response curve">
                    <rect x={zoneX1} y={topY} width={Math.max(0, zoneX2 - zoneX1)} height={baseY - topY} fill={zoneColor} />
                    <line x1={padL} y1={baseY} x2={padL + plotW} y2={baseY} stroke={CHART_INK.grid} strokeWidth="1" />
                    <line x1={sx(Nref)} y1={topY} x2={sx(Nref)} y2={baseY} stroke={CHART_INK.secondary} strokeWidth="1.5" strokeDasharray="3,2" />
                    <text x={sx(Nref)} y={baseY + 14} fontSize="10" textAnchor="middle" fill={CHART_INK.secondary}>{refLabel}</text>
                    <line x1={sx(Nc)} y1={topY} x2={sx(Nc)} y2={baseY} stroke={CHART_INK.muted} strokeWidth="1" />
                    <path d={d} fill="none" stroke={CHART_STATUS.accent} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
                    {[N1, N2].map((n, i) => (
                        <circle key={i} cx={sx(n)} cy={sy(1 / Math.sqrt(2))} r="4" fill={CHART_STATUS.accent} stroke="#fff" strokeWidth="2">
                            <title>{(i === 0 ? "N1" : "N2") + ": " + n.toFixed(0) + " rpm (half-power point)"}</title>
                        </circle>
                    ))}
                    <text x={sx(N1)} y={baseY + 14} fontSize="9" textAnchor="middle" fill={CHART_INK.muted}>N1</text>
                    <text x={sx(N2)} y={baseY + 14} fontSize="9" textAnchor="middle" fill={CHART_INK.muted}>N2</text>
                    <circle cx={sx(Nc)} cy={sy(1)} r="4" fill={CHART_INK.primary} stroke="#fff" strokeWidth="2"><title>{"Nc: " + Nc.toFixed(0) + " rpm (peak)"}</title></circle>
                    <text x={sx(Nc)} y={topY + 10} fontSize="10" fontWeight="700" textAnchor="middle" fill={CHART_INK.primary}>Nc</text>
                    <text x={padL} y={H - 4} fontSize="9" fill={CHART_INK.muted}>Illustrative shape from AF — not measured amplitude</text>
                </svg>
            );
        };

        // Reusable horizontal meter: a value bar against one or two reference
        // limit ticks. pass=null renders a neutral (informational) blue bar;
        // pass=true/false renders green/red.
        const LimitBar = ({ value, valueLabel, limit, limitLabel, secondaryLimit, secondaryLimitLabel, max, pass }) => {
            if (value == null) return null;
            const vmax = max || Math.max(value, limit || 0, secondaryLimit || 0) * 1.15 || 1;
            const W = 600, barH = 18, x0 = 4, barW = W - 8, y0 = 20;
            const sx = (v) => x0 + Math.max(0, Math.min(1, v / vmax)) * barW;
            const color = pass == null ? CHART_STATUS.accent : pass ? CHART_STATUS.good : CHART_STATUS.bad;
            const valueX = sx(value);
            return (
                <svg viewBox={`0 0 ${W} 54`} className="w-full h-auto" role="img">
                    <path d={roundedBarPath(x0, y0, barW, barH, 4)} fill="#f1f5f9" />
                    <path d={roundedBarPath(x0, y0, Math.max(0, valueX - x0), barH, 4)} fill={color} />
                    {secondaryLimit != null && (<>
                        <line x1={sx(secondaryLimit)} x2={sx(secondaryLimit)} y1={y0 - 4} y2={y0 + barH + 4} stroke={CHART_INK.muted} strokeWidth="1.5" strokeDasharray="3,2" />
                        <text x={sx(secondaryLimit)} y={y0 + barH + 16} fontSize="9" textAnchor="middle" fill={CHART_INK.muted}>{secondaryLimitLabel}</text>
                    </>)}
                    {limit != null && (<>
                        <line x1={sx(limit)} x2={sx(limit)} y1={y0 - 6} y2={y0 + barH + 6} stroke={CHART_INK.secondary} strokeWidth="2" strokeLinecap="round" />
                        <text x={sx(limit)} y={y0 - 9} fontSize="9" textAnchor="middle" fill={CHART_INK.secondary}>{limitLabel}</text>
                    </>)}
                    <text x={Math.min(valueX, W - 4)} y={y0 + barH + 16} fontSize="10" fontWeight="700" textAnchor={valueX > W - 60 ? "end" : "middle"} fill={CHART_INK.primary}>{valueLabel}</text>
                </svg>
            );
        };

        // Gear mesh frequency + 2nd harmonic on a frequency axis, with
        // optional nearby lateral critical speeds plotted for a quick
        // 10%-separation visual check.
        const MeshFreqChart = ({ fm, criticals = [] }) => {
            if (!(fm > 0)) return null;
            const validCriticals = criticals.filter(c => c.hz > 0);
            const xmax = Math.max(fm * 2, ...validCriticals.map(c => c.hz), 1) * 1.2;
            const W = 600, H = 96, x0 = 12, plotW = W - 24, axisY = 62;
            const sx = (v) => x0 + (v / xmax) * plotW;
            const harmonics = [{ mult: "1×", hz: fm, big: true }, { mult: "2×", hz: fm * 2, big: false }];
            return (
                <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto" role="img">
                    <line x1={x0} x2={x0 + plotW} y1={axisY} y2={axisY} stroke={CHART_INK.grid} strokeWidth="1" />
                    {harmonics.map((h, i) => (
                        <g key={i}>
                            <line x1={sx(h.hz)} x2={sx(h.hz)} y1={h.big ? axisY - 40 : axisY - 28} y2={axisY} stroke={CHART_STATUS.accent} strokeWidth={h.big ? 2 : 1.5} opacity={h.big ? 1 : 0.55} strokeLinecap="round" />
                            <circle cx={sx(h.hz)} cy={h.big ? axisY - 40 : axisY - 28} r="4" fill={CHART_STATUS.accent} opacity={h.big ? 1 : 0.55} stroke="#fff" strokeWidth="2" />
                            <text x={sx(h.hz)} y={h.big ? axisY - 46 : axisY - 34} fontSize="9" textAnchor="middle" fontWeight={h.big ? "700" : "400"} fill={CHART_INK.primary}>{h.mult} {h.hz.toFixed(0)}Hz</text>
                        </g>
                    ))}
                    {validCriticals.map((c, i) => {
                        const flagged = Math.abs(c.hz - fm) / fm < 0.1 || Math.abs(c.hz - fm * 2) / (fm * 2) < 0.1;
                        const color = flagged ? CHART_STATUS.bad : CHART_STATUS.good;
                        return (
                            <g key={"c" + i}>
                                <line x1={sx(c.hz)} x2={sx(c.hz)} y1={axisY} y2={axisY + 16} stroke={color} strokeWidth="2" strokeLinecap="round" />
                                <circle cx={sx(c.hz)} cy={axisY + 16} r="4" fill={color} stroke="#fff" strokeWidth="2" />
                                <text x={sx(c.hz)} y={axisY + 28} fontSize="9" textAnchor="middle" fill={color}>{c.label}</text>
                            </g>
                        );
                    })}
                </svg>
            );
        };

        // Illustrative straight-line interpolation between the onset speed
        // Q0 (log dec = 0, by definition) and the anticipated cross-coupling
        // QA — not the vendor's computed log-dec curve.
        const StabilityChart = ({ QA, Q0, logDecAtQA }) => {
            if (!(QA > 0 && Q0 > 0)) return null;
            const d = logDecAtQA != null ? logDecAtQA : 0;
            const dMax = Math.max(0.3, d * 1.4);
            const dMin = Math.min(0, d * 1.3);
            const W = 600, H = 168, x0 = 48, y0 = 14, plotW = W - x0 - 16, plotH = 112;
            const xmax = Math.max(QA, Q0) * 1.25;
            const sx = (v) => x0 + (v / xmax) * plotW;
            const sy = (v) => y0 + plotH - ((v - dMin) / (dMax - dMin)) * plotH;
            const lineColor = d <= 0 ? CHART_STATUS.bad : d < 0.1 ? CHART_STATUS.warn : CHART_STATUS.good;
            return (
                <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto" role="img">
                    <rect x={x0} y={y0} width={Math.max(0, sx(Q0) - x0)} height={plotH} fill={CHART_STATUS.goodWash} />
                    <rect x={sx(Q0)} y={y0} width={Math.max(0, x0 + plotW - sx(Q0))} height={plotH} fill={CHART_STATUS.badWash} />
                    <line x1={x0} x2={x0 + plotW} y1={sy(0)} y2={sy(0)} stroke={CHART_INK.grid} strokeWidth="1" />
                    <line x1={x0} x2={x0 + plotW} y1={sy(0.1)} y2={sy(0.1)} stroke={CHART_INK.muted} strokeWidth="1" strokeDasharray="3,2" />
                    <text x={x0 + plotW} y={sy(0.1) - 3} fontSize="9" textAnchor="end" fill={CHART_INK.muted}>0.1 min (informal)</text>
                    <line x1={sx(Q0)} y1={sy(0)} x2={sx(QA)} y2={sy(d)} stroke={lineColor} strokeWidth="2" strokeLinecap="round" />
                    <circle cx={sx(Q0)} cy={sy(0)} r="4" fill={CHART_INK.primary} stroke="#fff" strokeWidth="2" />
                    <text x={sx(Q0)} y={y0 + plotH + 16} fontSize="10" fontWeight="700" textAnchor="middle" fill={CHART_INK.primary}>Q0</text>
                    <circle cx={sx(QA)} cy={sy(d)} r="4" fill={lineColor} stroke="#fff" strokeWidth="2" />
                    <text x={sx(QA)} y={sy(d) - 10} fontSize="10" fontWeight="700" textAnchor="middle" fill={lineColor}>QA (δ={d.toFixed(2)})</text>
                    <text x={4} y={y0 + 8} fontSize="9" fill={CHART_INK.muted}>δ</text>
                    <text x={4} y={H - 4} fontSize="9" fill={CHART_INK.muted}>Illustrative straight-line fit between Q0 and QA — not the vendor's computed curve</text>
                </svg>
            );
        };

        // API 684 2nd Ed Figure 2-9 redrawn as live SVG: the guideline diagram
        // that decides whether a coupled train lateral analysis is needed.
        // Boundary, axes and region labels follow the published figure; the
        // markers are the reviewer's own couplings, one per shaft end.
        const FIG29_BOUNDARY = [[0, 1.5], [0.1, 2], [0.5, 2], [0.8, 3], [1, 3]];

        const TrainLateralChart = ({ points = [], floor = null }) => {
            const W = 620, H = 400, padL = 58, padR = 20, padT = 18, padB = 62;
            const plotW = W - padL - padR, plotH = H - padT - padB;
            const XMAX = 1, YMAX = 6;
            const sx = (x) => padL + (Math.max(0, Math.min(XMAX, x)) / XMAX) * plotW;
            const sy = (y) => padT + plotH - (Math.max(0, Math.min(YMAX, y)) / YMAX) * plotH;
            const line = FIG29_BOUNDARY.map(([x, y]) => `${sx(x)},${sy(y)}`).join(" ");
            const above = `${line} ${sx(1)},${sy(YMAX)} ${sx(0)},${sy(YMAX)}`;
            const below = `${line} ${sx(1)},${sy(0)} ${sx(0)},${sy(0)}`;
            const yTicks = [0, 1, 2, 3, 4, 5, 6];
            const xTicks = [0, 0.2, 0.4, 0.6, 0.8, 1];
            const anyClamped = points.some(p => p.x > XMAX || p.y > YMAX);

            // Nudge a label off any earlier label it would sit on top of.
            const labelNudge = [];
            points.forEach((p, i) => {
                const lx = sx(p.x) + 9, ly = sy(p.y) + 4;
                let dy = 0;
                for (let k = 0; k < i; k++) {
                    const q = points[k];
                    const qx = sx(q.x) + 9 + labelNudge[k].dx, qy = sy(q.y) + 4 + labelNudge[k].dy;
                    if (Math.abs(lx - qx) < 14 && Math.abs(ly + dy - qy) < 12) dy += 13;
                }
                labelNudge.push({ dx: 0, dy });
            });
            const anyOffChart = points.some(p => p.couplingType !== "flexible_spacer");

            return (
                <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto" role="img"
                    aria-label="API 684 Figure 2-9 train lateral guideline diagram with the entered couplings plotted">
                    {/* Regions: above the line the analysis is unnecessary, below it recommended */}
                    <polygon points={above} fill={CHART_STATUS.goodWash} />
                    <polygon points={below} fill={CHART_STATUS.badWash} />

                    {/* Gridlines + ticks */}
                    {yTicks.map(t => (
                        <g key={"y" + t}>
                            <line x1={padL} x2={padL + plotW} y1={sy(t)} y2={sy(t)} stroke={CHART_INK.grid} strokeWidth="1" />
                            <text x={padL - 8} y={sy(t) + 4} fontSize="10" textAnchor="end" fill={CHART_INK.muted}>{t}</text>
                        </g>
                    ))}
                    {xTicks.map(t => (
                        <g key={"x" + t}>
                            <line x1={sx(t)} x2={sx(t)} y1={padT} y2={padT + plotH} stroke={CHART_INK.grid} strokeWidth="1" />
                            <text x={sx(t)} y={padT + plotH + 16} fontSize="10" textAnchor="middle" fill={CHART_INK.muted}>{t}</text>
                        </g>
                    ))}
                    <rect x={padL} y={padT} width={plotW} height={plotH} fill="none" stroke={CHART_INK.secondary} strokeWidth="1" />

                    {/* Customer minimum ratio floor (ADNOC mode) */}
                    {floor > 0 && floor <= YMAX && (<>
                        <line x1={padL} x2={padL + plotW} y1={sy(floor)} y2={sy(floor)} stroke={CHART_STATUS.warn} strokeWidth="1.5" strokeDasharray="4,3" />
                        <text x={padL + plotW - 4} y={sy(floor) - 5} fontSize="9" textAnchor="end" fill={CHART_STATUS.warn}>
                            {"Customer minimum ratio " + floor.toFixed(2)}
                        </text>
                    </>)}

                    {/* Figure 2-9 boundary */}
                    <polyline points={line} fill="none" stroke={CHART_INK.primary} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
                    <text x={sx(0.28)} y={sy(3.8)} fontSize="11" fontWeight="700" fill={CHART_INK.secondary}>Train lateral unnecessary</text>
                    <text x={sx(0.30)} y={sy(0.9)} fontSize="11" fontWeight="700" fill={CHART_INK.secondary}>Train lateral recommended</text>

                    {/* Plotted coupling ends. The two ends of one coupling share
                        a y and often sit almost on top of each other, so the
                        number labels are nudged apart when they would collide. */}
                    {points.map((p, i) => {
                        const clamped = p.x > XMAX || p.y > YMAX;
                        const governedByChart = p.couplingType === "flexible_spacer";
                        const color = !governedByChart ? CHART_INK.muted : p.lateralRequired ? CHART_STATUS.bad : CHART_STATUS.good;
                        const cx = sx(p.x), cy = sy(p.y);
                        return (
                            <g key={p.couplingId + "-" + p.endKey}>
                                <circle cx={cx} cy={cy} r="5"
                                    fill={governedByChart ? color : "#fff"} stroke={governedByChart ? "#fff" : color}
                                    strokeWidth="2" strokeDasharray={governedByChart ? undefined : "2,2"} />
                                {p.marginal && <circle cx={cx} cy={cy} r="8.5" fill="none" stroke={CHART_STATUS.warn} strokeWidth="1.5" />}
                                {clamped && <path d={`M${cx - 5},${cy - 9} L${cx},${cy - 14} L${cx + 5},${cy - 9}`} fill="none" stroke={color} strokeWidth="1.5" />}
                                <text x={cx + 9 + labelNudge[i].dx} y={cy + 4 + labelNudge[i].dy} fontSize="10" fontWeight="700" fill={CHART_INK.primary}>{i + 1}</text>
                                <title>
                                    {`${i + 1}. ${p.couplingLabel} — ${p.endLabel} end\nNcr(spacer)/Nmcos = ${p.y.toFixed(2)}  ·  W½Cplg/Wjnl = ${p.x.toFixed(3)}\nRequired ratio ${p.required.toFixed(2)} — train lateral ${p.lateralRequired ? "recommended" : "unnecessary"}${clamped ? " (point plotted off-scale, clamped to the frame)" : ""}`}
                                </title>
                            </g>
                        );
                    })}

                    {/* Axis titles + provenance */}
                    <text x={16} y={padT + plotH / 2} fontSize="11" fill={CHART_INK.secondary} textAnchor="middle"
                        transform={`rotate(-90 16 ${padT + plotH / 2})`}>Ncr (spacer) / Nmcos</text>
                    <text x={padL + plotW / 2} y={padT + plotH + 34} fontSize="11" fill={CHART_INK.secondary} textAnchor="middle">W½Cplg / Wjnl</text>
                    <text x={padL} y={H - 16} fontSize="9" fill={CHART_INK.muted}>
                        {"Redrawn from API 684 2nd Ed, Figure 2-9 — a guideline diagram, not a pass/fail acceptance criterion."}
                    </text>
                    {(anyClamped || anyOffChart) && (
                        <text x={padL} y={H - 4} fontSize="9" fill={CHART_INK.muted}>
                            {[anyClamped ? "Caret marker = point off-scale, clamped to the frame." : null,
                              anyOffChart ? "Hollow marker = coupling not of the flexible spacer type; the chart does not govern it." : null]
                                .filter(Boolean).join("  ")}
                        </text>
                    )}
                </svg>
            );
        };

        const COUPLING_TYPE_OPTIONS = LatEng.COUPLING_TYPES;

        const TrainLateralPanel = ({ tl, screen, onField, onCoupling, onAddCoupling, onRemoveCoupling, onTrainType, onCustomerSpec }) => {
            const adnoc = tl.customerSpec === "adnoc";
            const floor = adnoc ? (num(tl.adnocFloor) || null) : null;
            const preset = LatData.TRAIN_TYPES.find(t => t.key === tl.trainType);
            let ptIndex = 0;

            return (
                <div className="bg-slate-50 border border-slate-200 rounded-lg p-4 mb-4">
                    <h4 className="text-sm font-bold text-slate-700 mb-1">Train Lateral Analysis Applicability — API 684 Figure 2-9</h4>
                    <p className="text-xs text-slate-500 mb-3">
                        Plots Ncr(spacer)/Nmcos against W½Cplg/Wjnl for every coupling in the train, one point per shaft end.
                        Weights may be in any consistent unit — both axes are ratios.
                    </p>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
                        <label className="block md:col-span-2">
                            <span className="block text-xs font-medium text-slate-500 mb-1">Train Type</span>
                            <select value={tl.trainType} onChange={e => onTrainType(e.target.value)} className="w-full text-sm p-2 border border-slate-300 rounded bg-white">
                                {LatData.TRAIN_TYPES.map(t => <option key={t.key} value={t.key}>{t.label}</option>)}
                            </select>
                        </label>
                        <label className="block">
                            <span className="block text-xs font-medium text-slate-500 mb-1">Customer Specification</span>
                            <select value={tl.customerSpec} onChange={e => onCustomerSpec(e.target.value)} className="w-full text-sm p-2 border border-slate-300 rounded bg-white">
                                <option value="none">None — API 684 only</option>
                                <option value="adnoc">ADNOC AGES</option>
                            </select>
                        </label>
                        {adnoc && (
                            <div className="md:col-span-3 grid grid-cols-1 md:grid-cols-3 gap-3 bg-amber-50 border border-amber-200 rounded p-3">
                                <NumField label="ADNOC minimum ratio floor" value={tl.adnocFloor} placeholder="2.0" onChange={v => onField({ adnocFloor: v })} />
                                <p className="md:col-span-2 text-xs text-amber-800 self-center">
                                    Applied on top of the Figure 2-9 line, and a geared train is treated as always requiring the analysis.
                                    Both are project/customer interpretations worded by rule — confirm the governing AGES clause and the floor value with COMPANY.
                                </p>
                            </div>
                        )}
                    </div>

                    <div className="flex items-center justify-between mb-2">
                        <span className="text-xs font-semibold text-slate-500 uppercase">
                            Couplings{preset ? ` — ${preset.geared ? "geared train" : "direct drive"}` : ""}
                        </span>
                        <button onClick={onAddCoupling} className="text-xs px-2 py-1 bg-blue-50 text-blue-700 rounded hover:bg-blue-100 flex items-center gap-1"><Icons.Plus />Add Coupling</button>
                    </div>

                    <div className="space-y-3 mb-4">
                        {tl.couplings.map((c, idx) => {
                            const res = screen.couplings[idx];
                            // A train-level rule can require the analysis even where this
                            // coupling clears the chart — don't badge that as a clean pass.
                            const trainRuleOverride = screen.trainLevelRequired && res && !res.lateralRequired;
                            return (
                                <div key={c.id} className="bg-white p-3 rounded border border-slate-200">
                                    <div className="flex items-start gap-2 mb-2">
                                        <input type="text" value={c.label} onChange={e => onCoupling(idx, "label", e.target.value)}
                                            className="flex-1 text-sm font-semibold p-2 border border-slate-200 rounded focus:ring-1 focus:ring-blue-500 outline-none" />
                                        {res && res.evaluated > 0 && (
                                            <span className={`text-xs font-bold uppercase px-2 py-1 rounded whitespace-nowrap ${res.lateralRequired ? "bg-red-100 text-red-700" : trainRuleOverride ? "bg-slate-100 text-slate-500" : res.marginal ? "bg-amber-100 text-amber-700" : "bg-green-100 text-green-700"}`}>
                                                {res.lateralRequired ? "Lateral required" : trainRuleOverride ? "Chart: not required" : res.marginal ? "Clears — marginal" : "Not required"}
                                            </span>
                                        )}
                                        {tl.couplings.length > 1 && <button onClick={() => onRemoveCoupling(idx)} className="text-red-500 hover:text-red-700 p-2"><Icons.Trash /></button>}
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-3 mb-3">
                                        <label className="block">
                                            <span className="block text-xs font-medium text-slate-500 mb-1">Coupling Type</span>
                                            <select value={c.type} onChange={e => onCoupling(idx, "type", e.target.value)} className="w-full text-sm p-2 border border-slate-300 rounded bg-white">
                                                {COUPLING_TYPE_OPTIONS.map(t => <option key={t.key} value={t.key}>{t.label}</option>)}
                                            </select>
                                        </label>
                                        <NumField label="Ncr (spacer)" unit="rpm" value={c.Ncr} onChange={v => onCoupling(idx, "Ncr", v)} />
                                        <NumField label="Nmcos — this shaft" unit="rpm" value={c.Nmcos} onChange={v => onCoupling(idx, "Nmcos", v)} />
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                        {["driver", "driven"].map(end => (
                                            <div key={end} className="bg-slate-50 border border-slate-200 rounded p-2">
                                                <input type="text" value={c[end + "Label"]} onChange={e => onCoupling(idx, end + "Label", e.target.value)}
                                                    className="w-full text-xs font-semibold text-slate-600 uppercase tracking-wide bg-transparent mb-2 p-1 border border-transparent hover:border-slate-200 focus:border-blue-400 rounded outline-none" />
                                                <div className="grid grid-cols-2 gap-2">
                                                    <NumField label="W½Cplg" unit="kg" value={c[end + "W"]} onChange={v => onCoupling(idx, end + "W", v)} />
                                                    <NumField label="Wjnl" unit="kg" value={c[end + "Wjnl"]} onChange={v => onCoupling(idx, end + "Wjnl", v)} />
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    {screen.evaluated ? (
                        <>
                            <div className={`p-3 rounded border mb-3 ${screen.lateralRequired ? "bg-red-50 border-red-200" : "bg-green-50 border-green-200"}`}>
                                <p className={`text-sm font-bold ${screen.lateralRequired ? "text-red-700" : "text-green-700"}`}>
                                    {screen.lateralRequired ? "Train lateral analysis REQUIRED" : "Train lateral analysis not required per API 684 Figure 2-9"}
                                </p>
                                {screen.reasons.length > 0 && (
                                    <ul className="mt-2 space-y-1">
                                        {screen.reasons.map((r, i) => (
                                            <li key={i} className="text-xs text-slate-600 flex items-start gap-1"><Icons.AlertTriangle />{r}</li>
                                        ))}
                                    </ul>
                                )}
                                {!screen.lateralRequired && (
                                    <p className="text-xs text-slate-600 mt-1">Record this conclusion and the values behind it in the check points below — a bare "not required" is not a basis.</p>
                                )}
                                {screen.anyIncomplete && (
                                    <p className="text-xs text-slate-500 mt-1">Some coupling ends are not yet complete — enter Ncr(spacer), Nmcos, W½Cplg and Wjnl for every end.</p>
                                )}
                            </div>

                            <div className="bg-white border border-slate-200 rounded p-2 mb-3">
                                <TrainLateralChart points={screen.points} floor={floor} />
                            </div>

                            <div className="overflow-x-auto">
                                <table className="w-full text-xs">
                                    <thead>
                                        <tr className="text-slate-500 border-b border-slate-200">
                                            <th className="text-left py-1 pr-2">#</th>
                                            <th className="text-left py-1 pr-2">Coupling / End</th>
                                            <th className="text-right py-1 pr-2">W½Cplg/Wjnl</th>
                                            <th className="text-right py-1 pr-2">Ncr(spacer)/Nmcos</th>
                                            <th className="text-right py-1 pr-2">Required</th>
                                            <th className="text-left py-1">Verdict</th>
                                        </tr>
                                    </thead>
                                    <tbody className="font-mono">
                                        {screen.couplings.map(c => c.ends.map(e => {
                                            if (!e.result) return null;
                                            ptIndex += 1;
                                            const r = e.result;
                                            return (
                                                <tr key={c.id + "-" + e.key} className="border-b border-slate-100 last:border-0">
                                                    <td className="py-1 pr-2 text-slate-400">{ptIndex}</td>
                                                    <td className="py-1 pr-2 font-sans text-slate-700">{c.label} — {e.label}</td>
                                                    <td className="py-1 pr-2 text-right">{r.x.toFixed(3)}</td>
                                                    <td className="py-1 pr-2 text-right">{r.y.toFixed(2)}</td>
                                                    <td className="py-1 pr-2 text-right">{r.required.toFixed(2)}</td>
                                                    <td className={`py-1 font-sans font-bold ${r.lateralRequired ? "text-red-600" : screen.trainLevelRequired ? "text-slate-500" : r.marginal ? "text-amber-600" : "text-green-600"}`}>
                                                        {r.lateralRequired ? "Lateral required"
                                                            : screen.trainLevelRequired ? "Chart: not required"
                                                            : r.marginal ? "Clears (marginal)" : "Not required"}
                                                    </td>
                                                </tr>
                                            );
                                        }))}
                                    </tbody>
                                </table>
                            </div>
                            <p className="text-xs text-slate-400 mt-2">{screen.basis}</p>
                        </>
                    ) : (
                        <p className="text-xs text-slate-400 italic">Enter Ncr(spacer), Nmcos and each end's W½Cplg / Wjnl to plot the couplings on Figure 2-9.</p>
                    )}
                </div>
            );
        };

        // Rotor-by-rotor review status overview (stacked bars). Placed near
        // the top of the tool so status is visible without drilling in.
        const StatusOverviewChart = ({ rows }) => {
            const W = 640, rowH = 22, rowGap = 12, padL = 130, padR = 92;
            const barW = W - padL - padR;
            const H = rows.length * (rowH + rowGap);
            const GAP = 2;
            return (
                <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto" role="img">
                    {rows.map((r, i) => {
                        const y = i * (rowH + rowGap);
                        const total = Math.max(1, r.total);
                        const segs = [
                            { v: r.compliant, color: CHART_STATUS.good },
                            { v: r.deviation, color: CHART_STATUS.bad },
                            { v: r.pending, color: "#e2e8f0" }
                        ];
                        let cx = padL;
                        return (
                            <g key={i}>
                                <text x={padL - 10} y={y + rowH / 2 + 4} fontSize="11" textAnchor="end" fill={CHART_INK.secondary} fontWeight="600">{r.name}</text>
                                {segs.map((s, si) => {
                                    if (s.v <= 0) return null;
                                    const rawW = (s.v / total) * barW;
                                    const w = Math.max(0, rawW - GAP);
                                    const el = <rect key={si} x={cx} y={y} width={w} height={rowH} rx="3" fill={s.color} />;
                                    cx += rawW;
                                    return el;
                                })}
                                <text x={padL + barW + 10} y={y + rowH / 2 + 4} fontSize="10" fill={CHART_INK.muted}>{r.compliant}/{r.total} compliant</text>
                            </g>
                        );
                    })}
                </svg>
            );
        };

        const SMCalculator = ({ calc, onChange }) => {
            const Nc = num(calc.Nc), N1 = num(calc.N1), N2 = num(calc.N2), Nref = num(calc.Nref);
            const valid = Nc > 0 && N1 != null && N2 != null && Nref > 0;
            const result = valid ? LatEng.separationMarginCheck({ Nc, N1, N2, Nref, position: calc.position }) : null;
            return (
                <div className="bg-slate-50 border border-slate-200 rounded-lg p-4 mb-4">
                    <h4 className="text-sm font-bold text-slate-700 mb-3">Amplification Factor &amp; Separation Margin</h4>
                    <div className="grid grid-cols-2 md:grid-cols-3 gap-3 mb-3">
                        <NumField label="Critical Speed Nc" unit="rpm" value={calc.Nc} onChange={v => onChange({ ...calc, Nc: v })} />
                        <NumField label="N1 (half-power)" unit="rpm" value={calc.N1} onChange={v => onChange({ ...calc, N1: v })} />
                        <NumField label="N2 (half-power)" unit="rpm" value={calc.N2} onChange={v => onChange({ ...calc, N2: v })} />
                        <NumField label="Reference Speed" unit="rpm" value={calc.Nref} placeholder="Nmin or Ntrip" onChange={v => onChange({ ...calc, Nref: v })} />
                        <label className="block">
                            <span className="block text-xs font-medium text-slate-500 mb-1">Critical Position</span>
                            <select value={calc.position} onChange={e => onChange({ ...calc, position: e.target.value })} className="w-full text-sm p-2 border border-slate-300 rounded bg-white">
                                <option value="below">Below Min Operating Speed</option>
                                <option value="above">Above Trip Speed</option>
                            </select>
                        </label>
                    </div>
                    {result ? (
                        <div>
                            <div className="grid grid-cols-3 gap-3 text-center mb-2">
                                <div><div className="text-xs text-slate-500">AF</div><div className="font-mono font-bold">{result.AF.toFixed(2)}</div></div>
                                <div><div className="text-xs text-slate-500">Required SM</div><div className="font-mono font-bold">{result.required.toFixed(1)}%</div></div>
                                <div><div className="text-xs text-slate-500">Actual SM</div><div className="font-mono font-bold">{result.actual.toFixed(1)}%</div></div>
                            </div>
                            <span className={`text-xs font-bold uppercase px-2 py-1 rounded ${result.pass ? "bg-green-100 text-green-700" : "bg-red-100 text-red-700"}`}>{result.pass ? "PASS" : "FAIL"}</span>
                            <p className="text-xs text-slate-400 mt-2">{result.basis}</p>
                            <div className="mt-3 bg-white border border-slate-200 rounded p-2">
                                <ResponseCurveChart Nc={Nc} N1={N1} N2={N2} Nref={Nref} position={calc.position} pass={result.pass} />
                            </div>
                        </div>
                    ) : <p className="text-xs text-slate-400 italic">Enter Nc, N1, N2 and the reference speed to compute.</p>}
                </div>
            );
        };

        const UnbalanceCalculator = ({ calc, onChange }) => {
            const W = num(calc.W), N = num(calc.N), mult = num(calc.multiplier) || 2, cap = num(calc.cap) || 50.8;
            const U = (W > 0 && N > 0) ? LatEng.residualUnbalance(W, N) : null;
            const Uan = U ? LatEng.analysisUnbalance(U.value, mult) : null;
            const A1 = (N > 0) ? LatEng.vibrationLimit(N, { cap }) : null;
            return (
                <div className="bg-slate-50 border border-slate-200 rounded-lg p-4 mb-4">
                    <h4 className="text-sm font-bold text-slate-700 mb-3">Residual Unbalance &amp; Vibration Limit</h4>
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-3">
                        <NumField label="Journal Static Load W" unit="kg" value={calc.W} onChange={v => onChange({ ...calc, W: v })} />
                        <NumField label="Max Cont. Speed N" unit="rpm" value={calc.N} onChange={v => onChange({ ...calc, N: v })} />
                        <NumField label="Analysis Multiplier" value={calc.multiplier} onChange={v => onChange({ ...calc, multiplier: v })} />
                        <NumField label="Vibration Limit Cap" unit="µm" value={calc.cap} placeholder="50.8 API617 / 25.4 API613" onChange={v => onChange({ ...calc, cap: v })} />
                    </div>
                    <ResultRow label="Allowable Residual Unbalance (U)" r={U} />
                    <ResultRow label={`Analysis Unbalance (${mult}× U)`} r={Uan} />
                    {Uan && U && (
                        <div className="bg-white border border-slate-200 rounded p-2 mb-3">
                            <LimitBar value={Uan.value} valueLabel={Uan.value.toFixed(0) + " g·mm"} limit={U.value} limitLabel={"U = " + U.value.toFixed(0)} pass={null} />
                        </div>
                    )}
                    <ResultRow label="Mechanical Test Vibration Limit (A1)" r={A1} />
                    {A1 && (
                        <div className="bg-white border border-slate-200 rounded p-2">
                            <LimitBar value={A1.raw} valueLabel={A1.raw.toFixed(1) + " µm" + (A1.capped ? " (capped)" : "")} limit={cap} limitLabel={"cap " + cap} pass={null} />
                        </div>
                    )}
                </div>
            );
        };

        const ClearanceCalculator = ({ calc, onChange }) => {
            const Ao = num(calc.Ao), minC = num(calc.minClearance);
            const result = (Ao != null && Ao >= 0 && minC > 0) ? LatEng.clearanceCheck(Ao, minC) : null;
            return (
                <div className="bg-slate-50 border border-slate-200 rounded-lg p-4 mb-4">
                    <h4 className="text-sm font-bold text-slate-700 mb-3">Predicted Amplitude vs. Running Clearance</h4>
                    <div className="grid grid-cols-2 gap-3 mb-3">
                        <NumField label="Predicted Amplitude Ao" unit="µm" value={calc.Ao} onChange={v => onChange({ ...calc, Ao: v })} />
                        <NumField label="Min. Diametral Clearance" unit="µm" value={calc.minClearance} onChange={v => onChange({ ...calc, minClearance: v })} />
                    </div>
                    <ResultRow label="Ao vs. 75% of Minimum Clearance" r={result} />
                    {result && (
                        <div className="mt-2 bg-white border border-slate-200 rounded p-2">
                            <LimitBar value={Ao} valueLabel={Ao.toFixed(0) + " µm"} limit={result.limit_um} limitLabel="75% limit" secondaryLimit={minC} secondaryLimitLabel="100% clearance" pass={result.pass} />
                        </div>
                    )}
                </div>
            );
        };

        const MeshCalculator = ({ calc, onChange }) => {
            const N = num(calc.N), teeth = num(calc.teeth);
            const result = (N > 0 && teeth > 0) ? LatEng.meshFrequency(N, teeth) : null;
            const c1 = num(calc.critical1), c2 = num(calc.critical2);
            const criticals = [
                c1 > 0 ? { label: "Critical 1", hz: c1 } : null,
                c2 > 0 ? { label: "Critical 2", hz: c2 } : null
            ].filter(Boolean);
            return (
                <div className="bg-slate-50 border border-slate-200 rounded-lg p-4 mb-4">
                    <h4 className="text-sm font-bold text-slate-700 mb-3">Gear Mesh Frequency</h4>
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-3">
                        <NumField label="Shaft Speed" unit="rpm" value={calc.N} onChange={v => onChange({ ...calc, N: v })} />
                        <NumField label="Tooth Count" value={calc.teeth} onChange={v => onChange({ ...calc, teeth: v })} />
                        <NumField label="Nearby Critical 1 (optional)" unit="Hz" value={calc.critical1} onChange={v => onChange({ ...calc, critical1: v })} />
                        <NumField label="Nearby Critical 2 (optional)" unit="Hz" value={calc.critical2} onChange={v => onChange({ ...calc, critical2: v })} />
                    </div>
                    <ResultRow label="Mesh Frequency" r={result} />
                    {result && (
                        <>
                            <p className="text-xs text-slate-500 mt-1 mb-2">2nd harmonic: {(result.value * 2).toFixed(1)} Hz — confirm both are clear of pinion/gear lateral critical speeds (flagged below if within 10%).</p>
                            <div className="bg-white border border-slate-200 rounded p-2">
                                <MeshFreqChart fm={result.value} criticals={criticals} />
                            </div>
                        </>
                    )}
                </div>
            );
        };

        const StabilityCalculator = ({ calc, onChange }) => {
            const stages = calc.stages;
            const parsedStages = stages.map(s => ({ P_kW: num(s.P), D_mm: num(s.D), H_mm: num(s.H), N_rpm: num(s.N), B: num(s.B) || 3 }));
            const stagesValid = parsedStages.length > 0 && parsedStages.every(s => s.P_kW > 0 && s.D_mm > 0 && s.H_mm > 0 && s.N_rpm > 0);
            const qaResult = stagesValid ? LatEng.anticipatedQA(parsedStages) : null;

            const Nmc = num(calc.Nmc), Nc1 = num(calc.Nc1), Q0 = num(calc.Q0);
            const logDec = calc.logDec !== "" ? num(calc.logDec) : null;
            const screen = LatEng.stabilityScreen({ Nmc, Nc1, Q0, QA: qaResult ? qaResult.value : null, logDecAtQA: logDec });

            const updateStage = (idx, field, val) => { const next = stages.map((s, i) => i === idx ? { ...s, [field]: val } : s); onChange({ ...calc, stages: next }); };
            const addStage = () => onChange({ ...calc, stages: [...stages, { P: "", D: "", H: "", N: "", B: "3" }] });
            const removeStage = (idx) => onChange({ ...calc, stages: stages.filter((_, i) => i !== idx) });

            return (
                <div className="bg-slate-50 border border-slate-200 rounded-lg p-4 mb-4">
                    <h4 className="text-sm font-bold text-slate-700 mb-3">Level I Stability Screening (Annex E)</h4>
                    <div className="mb-3">
                        <div className="flex items-center justify-between mb-2">
                            <span className="text-xs font-semibold text-slate-500 uppercase">Per-Impeller Cross-Coupling</span>
                            <button onClick={addStage} className="text-xs px-2 py-1 bg-blue-50 text-blue-700 rounded hover:bg-blue-100 flex items-center gap-1"><Icons.Plus />Add Stage</button>
                        </div>
                        <div className="space-y-2">
                            {stages.map((s, idx) => (
                                <div key={idx} className="grid grid-cols-5 gap-2 items-end bg-white p-2 rounded border border-slate-200">
                                    <NumField label="Power/Stage" unit="kW" value={s.P} onChange={v => updateStage(idx, "P", v)} />
                                    <NumField label="Impeller Dia" unit="mm" value={s.D} onChange={v => updateStage(idx, "D", v)} />
                                    <NumField label="Seal Gap" unit="mm" value={s.H} onChange={v => updateStage(idx, "H", v)} />
                                    <NumField label="Speed" unit="rpm" value={s.N} onChange={v => updateStage(idx, "N", v)} />
                                    <div className="flex gap-1 items-end">
                                        <div className="flex-1"><NumField label="B factor" value={s.B} onChange={v => updateStage(idx, "B", v)} /></div>
                                        {stages.length > 1 && <button onClick={() => removeStage(idx)} className="text-red-500 hover:text-red-700 p-2"><Icons.Trash /></button>}
                                    </div>
                                </div>
                            ))}
                        </div>
                        <ResultRow label="Anticipated Cross-Coupling QA (summed)" r={qaResult} />
                    </div>
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-3">
                        <NumField label="Max Cont. Speed Nmc" unit="rpm" value={calc.Nmc} onChange={v => onChange({ ...calc, Nmc: v })} />
                        <NumField label="1st Critical Nc1" unit="rpm" value={calc.Nc1} onChange={v => onChange({ ...calc, Nc1: v })} />
                        <NumField label="Onset Speed Q0" unit="N/mm" value={calc.Q0} onChange={v => onChange({ ...calc, Q0: v })} />
                        <NumField label="Log Dec at QA" value={calc.logDec} onChange={v => onChange({ ...calc, logDec: v })} />
                    </div>
                    {(qaResult && Q0 > 0) && (
                        <div className="bg-white border border-slate-200 rounded p-2 mb-3">
                            <StabilityChart QA={qaResult.value} Q0={Q0} logDecAtQA={logDec} />
                        </div>
                    )}
                    <div className="text-sm">
                        <div className="flex gap-6 mb-2">
                            {screen.CSR != null && <p>CSR (Nmc/Nc1): <span className="font-mono font-bold">{screen.CSR.toFixed(3)}</span></p>}
                            {screen.qRatio != null && <p>Q0 / QA: <span className="font-mono font-bold">{screen.qRatio.toFixed(2)}</span></p>}
                        </div>
                        {screen.reasons.length > 0 ? (
                            <ul className="space-y-1">
                                {screen.reasons.map((r, i) => (<li key={i} className="text-xs text-amber-700 bg-amber-50 p-2 rounded flex items-start gap-1"><Icons.AlertTriangle />{r}</li>))}
                            </ul>
                        ) : (screen.CSR != null || screen.qRatio != null) && <p className="text-xs text-green-700 bg-green-50 p-2 rounded">No screening flags raised by the values entered.</p>}
                        <p className="text-xs text-slate-400 mt-2">{screen.basis}</p>
                    </div>
                </div>
            );
        };

        const CriteriaPanel = ({ rotorTemplate, sectionKey, calc, onCalcChange }) => {
            if (!rotorTemplate) return null;
            if (sectionKey === "D") {
                return (<>
                    <SMCalculator calc={calc.sm} onChange={v => onCalcChange("sm", v)} />
                    <UnbalanceCalculator calc={calc.unbalance} onChange={v => onCalcChange("unbalance", v)} />
