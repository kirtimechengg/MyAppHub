    <script>
        // --- CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyBqGx_Skjp_RKxIK-pHRGOlp22uLJdy6WE",

        };
        Object.freeze(firebaseConfig);

        // --- APP CORE ENGINE ---
        class AppCore {
            constructor() {
                this.user = null;
                this.db = null;
                this.auth = null;
                this.globalState = {
                    theme: 'light',
                    notifications: 0,
                    lastActive: null,
                    globalNote: ''
                };
                this.stateListeners = [];
            }

            async init() {
                if (typeof firebase === 'undefined') return;
                if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                this.auth = firebase.auth();
                this.db = firebase.firestore();

                try {
                    await this.db.enablePersistence();
                    console.log("🔌 Offline mode enabled");
                } catch (err) {
                    console.log("Persistence disabled:", err.code);
                }

                this.injectStyles();
                // Finish a Google sign-in that redirected away and back - see
                // signInWithGoogle()/completeGoogleRedirect() below.
                await this.completeGoogleRedirect();
                this.setupAuth();
            }

            setupAuth() {
                this.auth.onAuthStateChanged(user => {
                    this.user = user;
                    if (user) {
                        this.connectGlobalStore();
                        this.renderNav(); 
                    } else {
                        this.renderNav();
                    }
                });
            }

            connectGlobalStore() {
                if (!this.user) return;
                this.db.collection('users').doc(this.user.uid).collection('app_data').doc('global_store')
                    .onSnapshot(doc => {
                        if (doc.exists) {
                            this.globalState = { ...this.globalState, ...doc.data() };
                            this.notifyListeners();
                            this.applyTheme(this.globalState.theme);
                        } else {
                            this.updateGlobalStore({ theme: 'light', created: Date.now() });
                        }
                    });
            }

            async updateGlobalStore(data) {
                if (!this.user) return;
                try {
                    await this.db.collection('users').doc(this.user.uid).collection('app_data').doc('global_store').set(
                        { ...data, lastUpdated: firebase.firestore.FieldValue.serverTimestamp() },
                        { merge: true }
                    );
                } catch (e) {
                    console.error("Sync Error:", e);
                }
            }

            subscribe(callback) {
                this.stateListeners.push(callback);
                callback(this.globalState);
            }

            notifyListeners() {
                this.stateListeners.forEach(cb => cb(this.globalState));
            }

            injectStyles() {
                if(typeof tailwind !== 'undefined') {
                    tailwind.config = {
                        darkMode: 'class',
                        theme: { extend: { fontFamily: { sans: ['Instrument Sans', 'sans-serif'] } } }
                    }
                }
            }

            applyTheme(theme) {
                if (theme === 'dark') document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }

            toggleTheme() {
                const newTheme = this.globalState.theme === 'dark' ? 'light' : 'dark';
                this.updateGlobalStore({ theme: newTheme });
            }

            // --- 🔐 GOOGLE SIGN-IN ---
            // Popup first, redirect second. On an iOS Home Screen web app a full-page
            // redirect hands the navigation off to Safari and never returns, so
            // getRedirectResult() would resolve null forever and the user would appear
            // permanently signed out. The popup stays inside this app's own context.
            // Redirect remains the fallback for webviews that block popups.
            async signInWithGoogle() {
                const provider = new firebase.auth.GoogleAuthProvider();
                try {
                    await this.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
                } catch (e) {
                    console.log('Auth persistence:', e.code || e.message);
                }
                // A standalone (Home Screen) web app has no browser window
                // chrome to host a popup - signInWithPopup silently fails or
                // hangs there instead of throwing something the fallback
                // below could react to, so skip straight to redirect.
                const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
                if (!standalone) {
                    try {
                        await this.auth.signInWithPopup(provider);
                        return;
                    } catch (e) {
                        if (e.code === 'auth/account-exists-with-different-credential') {
                            await this.linkPendingCredential(e);
                            return;
                        }
                        // Closing the popup is a deliberate cancel, not a reason to fall
                        // back to a redirect the user did not ask for.
                        if (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') return;
                        console.log('Popup sign-in unavailable, using redirect:', e.code || e.message);
                    }
                }
                try {
                    await this.auth.signInWithRedirect(provider);
                } catch (e) {
                    alert('Could not start Google sign-in: ' + e.message);
                }
            }

            // Handles the return trip from a redirect sign-in. A failure here used to be
            // swallowed into console.log, which made a broken redirect completely
            // invisible - the symptom that hid the iOS problem for so long.
            async completeGoogleRedirect() {
                const BENIGN = ['auth/no-auth-event', 'auth/popup-closed-by-user', 'auth/cancelled-popup-request'];
                try {
                    await this.auth.getRedirectResult();
                } catch (e) {
                    if (e.code === 'auth/account-exists-with-different-credential') {
                        await this.linkPendingCredential(e);
                    } else if (e.code && BENIGN.indexOf(e.code) === -1) {
                        console.log('Google sign-in:', e.code);
                        alert('Google sign-in did not complete: ' + (e.message || e.code));
                    }
                }
            }

            // One-time account link: this Google account's email already has a password
            // account, and Firebase refuses to silently merge the two. Linking once the
            // existing password is confirmed keeps the original uid - and every case
            // saved under it - intact. Shared by both the popup and redirect paths.
            async linkPendingCredential(e) {
                const email = e.email;
                const pendingCred = e.credential;
                const methods = email ? await this.auth.fetchSignInMethodsForEmail(email) : [];
                if (!methods.includes('password')) {
                    alert('Sign-in failed: ' + e.message);
                    return;
                }
                const password = prompt(
                    'You already have an account for ' + email + ' signed in with a password.\n' +
                    'Enter that password once to link Google sign-in to it:'
                );
                if (!password) return;
                try {
                    const cred = await this.auth.signInWithEmailAndPassword(email, password);
                    await cred.user.linkWithCredential(pendingCred);
                } catch (linkErr) {
                    alert('Could not link Google sign-in: ' + linkErr.message);
                }
            }

            renderNav() {
                const navContainer = document.getElementById('global-nav');
                if (!navContainer) return;

                const email = this.user ? (this.user.email || 'Anonymous') : 'Not Logged In';
                const avatar = email.charAt(0).toUpperCase();

                navContainer.innerHTML = `
                    <nav class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 sticky top-0 z-50">
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                            <a href="index.html" class="flex items-center gap-2 font-bold text-xl text-slate-800 dark:text-white hover:opacity-80 transition">
                                <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white">A</div>
                                <span>App Hub</span>
                            </a>

                            <div class="flex items-center gap-4">
                                <div id="global-status" class="hidden md:flex text-xs px-2 py-1 rounded bg-slate-100 dark:bg-slate-800 text-slate-500">
                                    ${this.user ? '🟢 Synced' : '⚪ Offline'}
                                </div>

                                <button onclick="window.Core.toggleTheme()" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                                    ${this.globalState.theme === 'dark' ? '🌙' : '☀️'}
                                </button>

                                ${this.user ? `
                                <div class="relative group cursor-pointer">
                                    <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-blue-500 to-purple-500 text-white flex items-center justify-center font-bold shadow-sm">
                                        ${avatar}
                                    </div>
                                    <div class="absolute right-0 mt-2 w-48 bg-white dark:bg-slate-800 rounded-xl shadow-xl border border-slate-200 dark:border-slate-700 py-1 hidden group-hover:block">
                                        <div class="px-4 py-2 border-b border-slate-200 dark:border-slate-700">
                                            <p class="text-xs text-slate-500">Signed in as</p>
                                            <p class="text-sm font-medium truncate text-slate-900 dark:text-slate-100">${email}</p>
                                        </div>
                                        <button onclick="firebase.auth().signOut()" class="w-full text-left px-4 py-2 text-sm text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20">Sign Out</button>
                                    </div>
                                </div>
                                ` : `
                                <button onclick="Core.signInWithGoogle()" class="flex items-center gap-2 pl-2 pr-3 py-1.5 rounded-lg text-sm font-semibold bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 transition shadow-sm">
                                    <svg width="16" height="16" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.09-1.8 2.73v2.27h2.92c1.7-1.57 2.68-3.88 2.68-6.64z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.17l-2.92-2.27c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.71H.96v2.34C2.44 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.97 10.71c-.18-.54-.28-1.11-.28-1.71s.1-1.17.28-1.71V4.95H.96C.35 6.17 0 7.55 0 9s.35 2.83.96 4.05l3.01-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.59-2.59C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.95l3.01 2.34C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
                                    <span class="text-slate-700 dark:text-slate-200">Sign in</span>
                                </button>
                                `}
                            </div>
                        </div>
                    </nav>
                `;
            }
        }

        // Initialize Global Instance
        window.Core = new AppCore();
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => window.Core.init());
        } else {
            window.Core.init();
        }
    </script>

            X: () => <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>

        const LatEng = window.LatEng;
        const LatData = window.LatData;
        const LS_KEY = "lva_tool_state";

        // --- DEFAULT STATE, BUILT FROM lateral-checklist.js ---
        function keyByArrayId(arr) {
            const out = {};
            arr.forEach(sec => { out[sec.id] = JSON.parse(JSON.stringify(sec)); });
            return out;
        }

        function defaultCalc(template) {
            return {
                sm: { Nc: "", N1: "", N2: "", Nref: "", position: "below" },
                unbalance: { W: "", N: "", multiplier: "2", cap: template === "gear" ? "25.4" : "50.8" },
                clearance: { Ao: "", minClearance: "" },
                mesh: { N: "", teeth: "" },
                stability: { Nmc: "", Nc1: "", Q0: "", logDec: "", stages: [{ P: "", D: "", H: "", N: "", B: "3" }] }
            };
        }

        function buildDefaultState() {
            const rotors = {};
            LatData.ROTORS.forEach(r => {
                rotors[r.key] = {
                    label: r.label,
                    template: r.template,
                    calc: defaultCalc(r.template),
                    sections: keyByArrayId(LatData.ROTOR_TEMPLATES[r.template])
                };
            });
            return {
                project: { ...LatData.PROJECT_DEFAULTS },
                shared: JSON.parse(JSON.stringify(LatData.SHARED_SECTIONS)),
                rotors
            };
        }

        // Defensive merge: fills anything missing from a loaded/imported
        // document with fresh defaults, so the corpus can grow over time
        // without breaking a document saved against an older version of it.
        function mergeWithDefaults(loaded) {
            const def = buildDefaultState();
            if (!loaded || typeof loaded !== "object") return def;
            const merged = {
                project: { ...def.project, ...(loaded.project || {}) },
                shared: { ...def.shared, ...(loaded.shared || {}) },
                rotors: {}
            };
            Object.keys(def.rotors).forEach(key => {
                const loadedRotor = (loaded.rotors && loaded.rotors[key]) || {};
                merged.rotors[key] = {
                    label: def.rotors[key].label,
                    template: def.rotors[key].template,
                    calc: { ...def.rotors[key].calc, ...(loadedRotor.calc || {}) },
                    sections: { ...def.rotors[key].sections, ...(loadedRotor.sections || {}) }
                };
            });
            return merged;
        }

        function loadInitialState() {
            try {
                const raw = localStorage.getItem(LS_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (parsed && parsed.project && parsed.shared && parsed.rotors) return mergeWithDefaults(parsed);
                }
            } catch (e) { /* ignore corrupt/blocked storage */ }
            return buildDefaultState();
        }

        function debounce(func, wait) {
            let timeout;
            return function (...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), wait);
            };
        }

        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay backdrop-blur-sm">
                    <div className="bg-white rounded-xl shadow-2xl w-full max-w-md border border-slate-200 animate-[fadeIn_0.2s_ease-out]">
                        <div className="flex justify-between items-center p-4 border-b border-slate-100">
                            <h3 className="text-lg font-bold text-slate-800">{title}</h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600 transition-colors"><Icons.X /></button>
                        </div>
                        <div className="p-4">{children}</div>
                    </div>
                </div>
            );
        };

        // --- CRITERIA CALCULATOR PIECES ---
        const NumField = ({ label, unit, value, onChange, placeholder, step = "any" }) => (
            <label className="block">
                <span className="block text-xs font-medium text-slate-500 mb-1">{label}{unit ? <span className="text-slate-400"> ({unit})</span> : null}</span>
                <input type="number" step={step} value={value} placeholder={placeholder}
                    onChange={e => onChange(e.target.value)}
                    className="w-full text-sm p-2 border border-slate-300 rounded focus:ring-1 focus:ring-blue-500 outline-none" />
            </label>
        );

        const ResultRow = ({ label, r }) => {
            if (!r) return <p className="text-xs text-slate-400 italic py-1">{label}: enter values above to compute.</p>;
            return (
                <div className="py-2 border-b border-slate-100 last:border-0">
                    <div className="flex items-center justify-between gap-2">
                        <span className="text-sm font-semibold text-slate-700">{label}</span>
                        {(r.pass === true || r.pass === false) && (
                            <span className={`text-xs font-bold uppercase px-2 py-0.5 rounded ${r.pass ? "bg-green-100 text-green-700" : "bg-red-100 text-red-700"}`}>{r.pass ? "Pass" : "Fail"}</span>
                        )}
                    </div>
                    <div className="text-sm font-mono text-slate-900 mt-0.5">
                        {typeof r.value === "number" ? r.value.toFixed(2) : r.value} {r.unit}
                        {r.us != null && <span className="text-slate-400">  ({typeof r.us === "number" ? r.us.toFixed(3) : r.us} {r.usUnit})</span>}
                    </div>
                    {r.basis && <div className="text-xs text-slate-400 mt-1">{r.basis}</div>}
                </div>
            );
        };

        const num = (v) => { const n = parseFloat(v); return isNaN(n) ? null : n; };

        const SMCalculator = ({ calc, onChange }) => {
            const Nc = num(calc.Nc), N1 = num(calc.N1), N2 = num(calc.N2), Nref = num(calc.Nref);
            const valid = Nc > 0 && N1 != null && N2 != null && Nref > 0;
            const result = valid ? LatEng.separationMarginCheck({ Nc, N1, N2, Nref, position: calc.position }) : null;
            return (
                <div className="bg-slate-50 border border-slate-200 rounded-lg p-4 mb-4">
                    <h4 className="text-sm font-bold text-slate-700 mb-3">Amplification Factor &amp; Separation Margin</h4>
                    <div className="grid grid-cols-2 md:grid-cols-3 gap-3 mb-3">
                        <NumField label="Critical Speed Nc" unit="rpm" value={calc.Nc} onChange={v => onChange({ ...calc, Nc: v })} />
                        <NumField label="N1 (half-power)" unit="rpm" value={calc.N1} onChange={v => onChange({ ...calc, N1: v })} />
                        <NumField label="N2 (half-power)" unit="rpm" value={calc.N2} onChange={v => onChange({ ...calc, N2: v })} />
                        <NumField label="Reference Speed" unit="rpm" value={calc.Nref} placeholder="Nmin or Ntrip" onChange={v => onChange({ ...calc, Nref: v })} />
                        <label className="block">
                            <span className="block text-xs font-medium text-slate-500 mb-1">Critical Position</span>
                            <select value={calc.position} onChange={e => onChange({ ...calc, position: e.target.value })} className="w-full text-sm p-2 border border-slate-300 rounded bg-white">
                                <option value="below">Below Min Operating Speed</option>
                                <option value="above">Above Trip Speed</option>
                            </select>
                        </label>
                    </div>
                    {result ? (
                        <div>
                            <div className="grid grid-cols-3 gap-3 text-center mb-2">
                                <div><div className="text-xs text-slate-500">AF</div><div className="font-mono font-bold">{result.AF.toFixed(2)}</div></div>
                                <div><div className="text-xs text-slate-500">Required SM</div><div className="font-mono font-bold">{result.required.toFixed(1)}%</div></div>
                                <div><div className="text-xs text-slate-500">Actual SM</div><div className="font-mono font-bold">{result.actual.toFixed(1)}%</div></div>
                            </div>
                            <span className={`text-xs font-bold uppercase px-2 py-1 rounded ${result.pass ? "bg-green-100 text-green-700" : "bg-red-100 text-red-700"}`}>{result.pass ? "PASS" : "FAIL"}</span>
                            <p className="text-xs text-slate-400 mt-2">{result.basis}</p>
                        </div>
                    ) : <p className="text-xs text-slate-400 italic">Enter Nc, N1, N2 and the reference speed to compute.</p>}
                </div>
            );
        };

        const UnbalanceCalculator = ({ calc, onChange }) => {
            const W = num(calc.W), N = num(calc.N), mult = num(calc.multiplier) || 2, cap = num(calc.cap) || 50.8;
            const U = (W > 0 && N > 0) ? LatEng.residualUnbalance(W, N) : null;
            const Uan = U ? LatEng.analysisUnbalance(U.value, mult) : null;
            const A1 = (N > 0) ? LatEng.vibrationLimit(N, { cap }) : null;
            return (
                <div className="bg-slate-50 border border-slate-200 rounded-lg p-4 mb-4">
                    <h4 className="text-sm font-bold text-slate-700 mb-3">Residual Unbalance &amp; Vibration Limit</h4>
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-3">
                        <NumField label="Journal Static Load W" unit="kg" value={calc.W} onChange={v => onChange({ ...calc, W: v })} />
                        <NumField label="Max Cont. Speed N" unit="rpm" value={calc.N} onChange={v => onChange({ ...calc, N: v })} />
                        <NumField label="Analysis Multiplier" value={calc.multiplier} onChange={v => onChange({ ...calc, multiplier: v })} />
                        <NumField label="Vibration Limit Cap" unit="µm" value={calc.cap} placeholder="50.8 API617 / 25.4 API613" onChange={v => onChange({ ...calc, cap: v })} />
                    </div>
                    <ResultRow label="Allowable Residual Unbalance (U)" r={U} />
                    <ResultRow label={`Analysis Unbalance (${mult}× U)`} r={Uan} />
                    <ResultRow label="Mechanical Test Vibration Limit (A1)" r={A1} />
                </div>
            );
        };

        const ClearanceCalculator = ({ calc, onChange }) => {
            const Ao = num(calc.Ao), minC = num(calc.minClearance);
            const result = (Ao != null && Ao >= 0 && minC > 0) ? LatEng.clearanceCheck(Ao, minC) : null;
            return (
                <div className="bg-slate-50 border border-slate-200 rounded-lg p-4 mb-4">
                    <h4 className="text-sm font-bold text-slate-700 mb-3">Predicted Amplitude vs. Running Clearance</h4>
                    <div className="grid grid-cols-2 gap-3 mb-3">
                        <NumField label="Predicted Amplitude Ao" unit="µm" value={calc.Ao} onChange={v => onChange({ ...calc, Ao: v })} />
                        <NumField label="Min. Diametral Clearance" unit="µm" value={calc.minClearance} onChange={v => onChange({ ...calc, minClearance: v })} />
                    </div>
                    <ResultRow label="Ao vs. 75% of Minimum Clearance" r={result} />
                </div>
            );
        };

        const MeshCalculator = ({ calc, onChange }) => {
            const N = num(calc.N), teeth = num(calc.teeth);
            const result = (N > 0 && teeth > 0) ? LatEng.meshFrequency(N, teeth) : null;
            return (
                <div className="bg-slate-50 border border-slate-200 rounded-lg p-4 mb-4">
                    <h4 className="text-sm font-bold text-slate-700 mb-3">Gear Mesh Frequency</h4>
                    <div className="grid grid-cols-2 gap-3 mb-3">
                        <NumField label="Shaft Speed" unit="rpm" value={calc.N} onChange={v => onChange({ ...calc, N: v })} />
                        <NumField label="Tooth Count" value={calc.teeth} onChange={v => onChange({ ...calc, teeth: v })} />
                    </div>
                    <ResultRow label="Mesh Frequency" r={result} />
                    {result && <p className="text-xs text-slate-500 mt-1">2nd harmonic: {(result.value * 2).toFixed(1)} Hz — confirm both are clear of pinion/gear lateral critical speeds.</p>}
                </div>
            );
        };

        const StabilityCalculator = ({ calc, onChange }) => {
            const stages = calc.stages;
            const parsedStages = stages.map(s => ({ P_kW: num(s.P), D_mm: num(s.D), H_mm: num(s.H), N_rpm: num(s.N), B: num(s.B) || 3 }));
            const stagesValid = parsedStages.length > 0 && parsedStages.every(s => s.P_kW > 0 && s.D_mm > 0 && s.H_mm > 0 && s.N_rpm > 0);
            const qaResult = stagesValid ? LatEng.anticipatedQA(parsedStages) : null;

            const Nmc = num(calc.Nmc), Nc1 = num(calc.Nc1), Q0 = num(calc.Q0);
            const logDec = calc.logDec !== "" ? num(calc.logDec) : null;
            const screen = LatEng.stabilityScreen({ Nmc, Nc1, Q0, QA: qaResult ? qaResult.value : null, logDecAtQA: logDec });

            const updateStage = (idx, field, val) => { const next = stages.map((s, i) => i === idx ? { ...s, [field]: val } : s); onChange({ ...calc, stages: next }); };
            const addStage = () => onChange({ ...calc, stages: [...stages, { P: "", D: "", H: "", N: "", B: "3" }] });
            const removeStage = (idx) => onChange({ ...calc, stages: stages.filter((_, i) => i !== idx) });

            return (
                <div className="bg-slate-50 border border-slate-200 rounded-lg p-4 mb-4">
                    <h4 className="text-sm font-bold text-slate-700 mb-3">Level I Stability Screening (Annex E)</h4>
                    <div className="mb-3">
                        <div className="flex items-center justify-between mb-2">
                            <span className="text-xs font-semibold text-slate-500 uppercase">Per-Impeller Cross-Coupling</span>
                            <button onClick={addStage} className="text-xs px-2 py-1 bg-blue-50 text-blue-700 rounded hover:bg-blue-100 flex items-center gap-1"><Icons.Plus />Add Stage</button>
                        </div>
                        <div className="space-y-2">
                            {stages.map((s, idx) => (
                                <div key={idx} className="grid grid-cols-5 gap-2 items-end bg-white p-2 rounded border border-slate-200">
                                    <NumField label="Power/Stage" unit="kW" value={s.P} onChange={v => updateStage(idx, "P", v)} />
                                    <NumField label="Impeller Dia" unit="mm" value={s.D} onChange={v => updateStage(idx, "D", v)} />
                                    <NumField label="Seal Gap" unit="mm" value={s.H} onChange={v => updateStage(idx, "H", v)} />
                                    <NumField label="Speed" unit="rpm" value={s.N} onChange={v => updateStage(idx, "N", v)} />
                                    <div className="flex gap-1 items-end">
                                        <div className="flex-1"><NumField label="B factor" value={s.B} onChange={v => updateStage(idx, "B", v)} /></div>
                                        {stages.length > 1 && <button onClick={() => removeStage(idx)} className="text-red-500 hover:text-red-700 p-2"><Icons.Trash /></button>}
                                    </div>
                                </div>
                            ))}
                        </div>
                        <ResultRow label="Anticipated Cross-Coupling QA (summed)" r={qaResult} />
                    </div>
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-3">
                        <NumField label="Max Cont. Speed Nmc" unit="rpm" value={calc.Nmc} onChange={v => onChange({ ...calc, Nmc: v })} />
                        <NumField label="1st Critical Nc1" unit="rpm" value={calc.Nc1} onChange={v => onChange({ ...calc, Nc1: v })} />
                        <NumField label="Onset Speed Q0" unit="N/mm" value={calc.Q0} onChange={v => onChange({ ...calc, Q0: v })} />
                        <NumField label="Log Dec at QA" value={calc.logDec} onChange={v => onChange({ ...calc, logDec: v })} />
                    </div>
                    <div className="text-sm">
                        <div className="flex gap-6 mb-2">
                            {screen.CSR != null && <p>CSR (Nmc/Nc1): <span className="font-mono font-bold">{screen.CSR.toFixed(3)}</span></p>}
                            {screen.qRatio != null && <p>Q0 / QA: <span className="font-mono font-bold">{screen.qRatio.toFixed(2)}</span></p>}
                        </div>
                        {screen.reasons.length > 0 ? (
                            <ul className="space-y-1">
                                {screen.reasons.map((r, i) => (<li key={i} className="text-xs text-amber-700 bg-amber-50 p-2 rounded flex items-start gap-1"><Icons.AlertTriangle />{r}</li>))}
                            </ul>
                        ) : (screen.CSR != null || screen.qRatio != null) && <p className="text-xs text-green-700 bg-green-50 p-2 rounded">No screening flags raised by the values entered.</p>}
                        <p className="text-xs text-slate-400 mt-2">{screen.basis}</p>
                    </div>
                </div>
            );
        };

        const CriteriaPanel = ({ rotorTemplate, sectionKey, calc, onCalcChange }) => {
            if (!rotorTemplate) return null;
            if (sectionKey === "D") {
                return (<>
                    <SMCalculator calc={calc.sm} onChange={v => onCalcChange("sm", v)} />
                    <UnbalanceCalculator calc={calc.unbalance} onChange={v => onCalcChange("unbalance", v)} />
                    <ClearanceCalculator calc={calc.clearance} onChange={v => onCalcChange("clearance", v)} />
                </>);
            }
            if (sectionKey === "E" && rotorTemplate === "gear") return <MeshCalculator calc={calc.mesh} onChange={v => onCalcChange("mesh", v)} />;
            if (sectionKey === "E" && rotorTemplate === "comp") return <StabilityCalculator calc={calc.stability} onChange={v => onCalcChange("stability", v)} />;
            return null;
        };

        // --- ITEM CARD (identical shape/behaviour to tva_tool.html) ---
        const ItemCard = ({ item, onCheck, onStatusChange, onNoteChange }) => (
            <div className="p-6 hover:bg-slate-50 transition-colors group">
                <div className="flex items-start gap-4">
                    <button onClick={onCheck} className={`mt-1 flex-shrink-0 w-6 h-6 rounded border-2 flex items-center justify-center transition-all ${item.checked ? "bg-blue-600 border-blue-600" : "border-slate-300 hover:border-blue-400"}`}>
                        {item.checked && <Icons.CheckCircle className="text-white w-4 h-4" />}
                    </button>
                    <div className="flex-1">
                        <div className="flex justify-between items-start mb-2">
                            <div>
                                <span className="text-xs font-semibold bg-slate-100 text-slate-500 px-2 py-0.5 rounded">{item.category}</span>
                                <h3 className="text-base font-bold text-slate-800 mt-1">{item.label}</h3>
                            </div>
                            <select value={item.status} onChange={e => onStatusChange(e.target.value)}
                                className={`text-xs font-bold uppercase rounded px-2 py-1 border-0 focus:ring-0 cursor-pointer ${item.status === "compliant" ? "bg-green-100 text-green-700" : item.status === "deviation" ? "bg-red-100 text-red-700" : "bg-slate-100 text-slate-500"}`}>
                                <option value="pending">Pending</option>
                                <option value="compliant">Compliant</option>
                                <option value="deviation">Deviation</option>
                            </select>
                        </div>
                        <p className="text-sm text-slate-600 mb-2"><strong className="text-slate-900">Req:</strong> {item.requirement}</p>
                        {item.insight && <p className="text-xs text-blue-600 bg-blue-50 p-2 rounded mb-3 flex items-start gap-1"><Icons.Info />{item.insight}</p>}
                        <textarea value={item.notes} onChange={e => onNoteChange(e.target.value)} placeholder="Observations..."
                            className="w-full text-sm p-2 bg-white border border-slate-200 rounded focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none h-16" />
                    </div>
                </div>
            </div>
        );

        const LVAReviewTool = () => {
            const [state, setState] = useState(loadInitialState);
            const [activeRotor, setActiveRotor] = useState("shared");
            const [activeSection, setActiveSection] = useState("basis");
            const [searchQuery, setSearchQuery] = useState("");
            const [progress, setProgress] = useState(0);
            const [saving, setSaving] = useState(false);
            const [user, setUser] = useState(null);

            const [isSectionModalOpen, setIsSectionModalOpen] = useState(false);
            const [isItemModalOpen, setIsItemModalOpen] = useState(false);
            const [newSectionData, setNewSectionData] = useState({ title: "", iconKey: "Shield" });
            const [newItemData, setNewItemData] = useState({ category: "", label: "", requirement: "", insight: "" });

            const fileInputRef = useRef(null);

            // --- ROTOR SELECTOR ---
            const rotorTabs = [{ key: "shared", label: "Train (Shared)", template: null }]
                .concat(LatData.ROTORS.map(r => ({ key: r.key, label: r.label, template: r.template })));

            const selectRotor = (key) => {
                setActiveRotor(key);
                setActiveSection(key === "shared" ? "basis" : "A");
                setSearchQuery("");
            };

            const currentSections = activeRotor === "shared" ? state.shared : state.rotors[activeRotor].sections;
            const currentTemplate = activeRotor === "shared" ? null : state.rotors[activeRotor].template;

            // --- PERSISTENCE: localStorage (works signed-out) ---
            const lsSaveRef = useRef(debounce((s) => {
                try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch (e) { /* storage unavailable */ }
            }, 500));
            useEffect(() => { lsSaveRef.current(state); }, [state]);
            useEffect(() => {
                const flush = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} };
                const onVis = () => { if (document.visibilityState === "hidden") flush(); };
                window.addEventListener("pagehide", flush);
                document.addEventListener("visibilitychange", onVis);
                return () => { window.removeEventListener("pagehide", flush); document.removeEventListener("visibilitychange", onVis); };
            }, [state]);

            // --- PERSISTENCE: Firestore (signed-in only) ---
            useEffect(() => {
                const checkAuth = setInterval(() => {
                    if (window.Core && window.Core.user) {
                        setUser(window.Core.user);
                        clearInterval(checkAuth);
                        loadFromFirebase(window.Core.user.uid);
                    }
                }, 500);
                return () => clearInterval(checkAuth);
            }, []);

            const loadFromFirebase = (uid) => {
                if (!window.Core || !window.Core.db) return;
                window.Core.db.collection("users").doc(uid).collection("app_data").doc("lva_tool").get()
                    .then((doc) => {
                        if (doc.exists) {
                            const data = doc.data();
                            setState(mergeWithDefaults({ project: data.project, shared: data.shared, rotors: data.rotors }));
                        } else {
                            saveToFirebase(state, uid);
                        }
                    }).catch(err => console.error("Load Error:", err));
            };

            const saveToFirebase = async (s, uid) => {
                if (!window.Core || !window.Core.db) return;
                setSaving(true);
                try {
                    await window.Core.db.collection("users").doc(uid).collection("app_data").doc("lva_tool").set({
                        project: s.project, shared: s.shared, rotors: s.rotors, lastModified: new Date().toISOString()
                    }, { merge: true });
                    setTimeout(() => setSaving(false), 500);
                } catch (e) { console.error("Save failed", e); setSaving(false); }
            };

            const fbSaveRef = useRef(debounce((s, uid) => saveToFirebase(s, uid), 2000));
            useEffect(() => {
                if (user) { setSaving(true); fbSaveRef.current(state, user.uid); }
            }, [state, user]);

            // --- PROGRESS ---
            useEffect(() => {
                let total = 0, checked = 0;
                Object.values(state.shared).forEach(sec => sec.items.forEach(it => { total++; if (it.checked) checked++; }));
                Object.values(state.rotors).forEach(rot => Object.values(rot.sections).forEach(sec => sec.items.forEach(it => { total++; if (it.checked) checked++; })));
                setProgress(total === 0 ? 0 : Math.round((checked / total) * 100));
            }, [state]);

            // --- ITEM MUTATION HELPERS ---
            const mutateItem = (rotorScope, sectionKey, itemId, mutator) => {
                setState(prev => {
                    const next = JSON.parse(JSON.stringify(prev));
                    const bucket = rotorScope === "shared" ? next.shared : next.rotors[rotorScope].sections;
                    const item = bucket[sectionKey].items.find(i => i.id === itemId);
                    if (item) mutator(item);
                    return next;
                });
            };
            const handleCheck = (scope, sectionKey, itemId) => mutateItem(scope, sectionKey, itemId, (item) => {
                item.checked = !item.checked; item.status = item.checked ? "compliant" : "pending";
            });
            const handleStatusChange = (scope, sectionKey, itemId, newStatus) => mutateItem(scope, sectionKey, itemId, (item) => { item.status = newStatus; });
            const handleNoteChange = (scope, sectionKey, itemId, note) => mutateItem(scope, sectionKey, itemId, (item) => { item.notes = note; });

            const handleCalcChange = (rotorKey, group, value) => {
                setState(prev => {
                    const next = JSON.parse(JSON.stringify(prev));
                    next.rotors[rotorKey].calc[group] = value;
                    return next;
                });
            };

            const resetData = () => {
                if (confirm("Reset all data to default? This cannot be undone.")) {
                    const def = buildDefaultState();
                    setState(def);
                    if (user) saveToFirebase(def, user.uid);
                }
            };

            // --- EXPORT / IMPORT ---
            const exportJSON = () => {
                const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.href = url;
                link.download = `LVA_Review_Backup_${new Date().toISOString().split("T")[0]}.json`;
                document.body.appendChild(link); link.click(); document.body.removeChild(link);
            };
            const handleImportClick = () => { if (fileInputRef.current) fileInputRef.current.click(); };
            const handleImportFile = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const imported = JSON.parse(e.target.result);
                        if (imported && typeof imported === "object") {
                            if (confirm("Overwrite current data with imported file?")) {
                                const merged = mergeWithDefaults(imported);
                                setState(merged);
                                if (user) saveToFirebase(merged, user.uid);
                                alert("Import successful!");
                            }
                        } else { alert("Invalid file format."); }
                    } catch (error) { console.error("Import error:", error); alert("Failed to parse JSON."); }
                };
                reader.readAsText(file);
                event.target.value = "";
            };

            // Recompute every numeric criterion from the calculator inputs the
            // same way the on-screen panels do, for the PDF/Excel summary.
            const buildCriteriaSummary = () => {
                const rows = [];
                LatData.ROTORS.forEach(r => {
                    const calc = state.rotors[r.key].calc;
                    const sm = calc.sm, un = calc.unbalance, cl = calc.clearance;
                    const Nc = num(sm.Nc), N1 = num(sm.N1), N2 = num(sm.N2), Nref = num(sm.Nref);
                    if (Nc > 0 && N1 != null && N2 != null && Nref > 0) {
                        const res = LatEng.separationMarginCheck({ Nc, N1, N2, Nref, position: sm.position });
                        if (res) rows.push([r.label, "Separation Margin", `AF ${res.AF.toFixed(2)}, req ${res.required.toFixed(1)}%, actual ${res.actual.toFixed(1)}%`, res.pass ? "PASS" : "FAIL"]);
                    }
                    const W = num(un.W), N = num(un.N);
                    if (W > 0 && N > 0) {
                        const U = LatEng.residualUnbalance(W, N);
                        rows.push([r.label, "Allowable Residual Unbalance", `${U.value.toFixed(1)} g·mm (${U.us.toFixed(3)} oz·in)`, "-"]);
                        const A1 = LatEng.vibrationLimit(N, { cap: num(un.cap) || 50.8 });
                        rows.push([r.label, "Vibration Limit A1", `${A1.value.toFixed(1)} µm (${A1.us.toFixed(2)} mil)`, "-"]);
                    }
                    const Ao = num(cl.Ao), minC = num(cl.minClearance);
                    if (Ao != null && Ao >= 0 && minC > 0) {
                        const res = LatEng.clearanceCheck(Ao, minC);
                        rows.push([r.label, "Ao vs. 75% Clearance", `${res.value.toFixed(1)} µm vs limit ${res.limit_um.toFixed(1)} µm`, res.pass ? "PASS" : "FAIL"]);
                    }
                    if (r.template === "gear") {
                        const mesh = calc.mesh, Nm = num(mesh.N), teeth = num(mesh.teeth);
                        if (Nm > 0 && teeth > 0) {
                            const res = LatEng.meshFrequency(Nm, teeth);
                            rows.push([r.label, "Gear Mesh Frequency", `${res.value.toFixed(1)} Hz`, "-"]);
                        }
                    }
                    if (r.template === "comp") {
                        const st = calc.stability;
                        const parsedStages = st.stages.map(s => ({ P_kW: num(s.P), D_mm: num(s.D), H_mm: num(s.H), N_rpm: num(s.N), B: num(s.B) || 3 }));
                        const stagesValid = parsedStages.length > 0 && parsedStages.every(s => s.P_kW > 0 && s.D_mm > 0 && s.H_mm > 0 && s.N_rpm > 0);
                        const qa = stagesValid ? LatEng.anticipatedQA(parsedStages) : null;
                        if (qa) rows.push([r.label, "Anticipated Cross-Coupling QA", `${qa.value.toFixed(1)} N/mm (${qa.us.toFixed(1)} lbf/in)`, "-"]);
                        const Nmc = num(st.Nmc), Nc1 = num(st.Nc1), Q0 = num(st.Q0), logDec = st.logDec !== "" ? num(st.logDec) : null;
                        const screen = LatEng.stabilityScreen({ Nmc, Nc1, Q0, QA: qa ? qa.value : null, logDecAtQA: logDec });
                        if (screen.CSR != null || screen.qRatio != null) {
                            rows.push([r.label, "Stability Screen", `CSR ${screen.CSR != null ? screen.CSR.toFixed(3) : "-"}, Q0/QA ${screen.qRatio != null ? screen.qRatio.toFixed(2) : "-"}`, screen.levelIIFlagged ? "FLAGGED" : "OK"]);
                        }
                    }
                });
                return rows;
            };

            const exportPDF = () => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                doc.setFontSize(20); doc.setTextColor(41, 128, 185);
                doc.text("Train Lateral Vibration Analysis (LVA) Review", 14, 20);
                doc.setFontSize(10); doc.setTextColor(100);
                doc.text(`Generated: ${new Date().toLocaleString()}`, 14, 26);

                doc.setDrawColor(200); doc.setFillColor(245, 247, 250);
                doc.rect(14, 32, 182, 44, "F");
                doc.setFontSize(11); doc.setTextColor(0); doc.setFont(undefined, "bold");
                doc.text("Project Information", 18, 40);
                doc.setFont(undefined, "normal"); doc.setFontSize(10);
                doc.text(`End Customer: ${state.project.endCustomer}`, 18, 48);
                doc.text(`Project Name: ${state.project.project}`, 18, 54);
                doc.text(`Specs: ${state.project.specifications}`, 18, 60);
                doc.text(`Configuration: ${state.project.configuration}`, 18, 66);
                doc.text(`Service: ${state.project.service}`, 110, 48);
                doc.text(`Manufacturer: ${state.project.manufacturer}`, 110, 54);
                doc.text(`Model: ${state.project.model}`, 110, 60);

                let yPos = 84;
                const criteria = buildCriteriaSummary();
                if (criteria.length) {
                    doc.setFontSize(13); doc.setTextColor(0); doc.setFont(undefined, "bold");
                    doc.text("Criteria Calculator Summary", 14, yPos); yPos += 4;
                    doc.autoTable({
                        startY: yPos, head: [["Rotor", "Check", "Result", "Verdict"]], body: criteria, theme: "grid",
                        headStyles: { fillColor: [41, 128, 185], textColor: 255 }, styles: { fontSize: 8, cellPadding: 2 },
                        didDrawPage: (data) => { yPos = data.cursor.y + 12; }
                    });
                    yPos = doc.lastAutoTable.finalY + 12;
                }

                const renderSections = (sectionsObj, heading) => {
                    if (yPos > 260) { doc.addPage(); yPos = 20; }
                    doc.setFontSize(15); doc.setTextColor(0); doc.setFont(undefined, "bold");
                    doc.text(heading, 14, yPos); yPos += 6;
                    Object.values(sectionsObj).forEach(section => {
                        if (yPos > 270) { doc.addPage(); yPos = 20; }
                        doc.setFontSize(12); doc.setFont(undefined, "bold");
                        doc.text(section.title, 14, yPos); yPos += 4;
                        const tableData = section.items.map(item => [item.label, item.requirement, item.status.toUpperCase(), item.notes || "-"]);
                        doc.autoTable({
                            startY: yPos, head: [["Item", "Requirement", "Status", "Notes"]], body: tableData, theme: "grid",
                            headStyles: { fillColor: [41, 128, 185], textColor: 255 }, styles: { fontSize: 8, cellPadding: 2 },
                            columnStyles: { 0: { cellWidth: 40 }, 1: { cellWidth: 50 }, 2: { cellWidth: 20 }, 3: { cellWidth: "auto" } },
                            didDrawPage: (data) => { yPos = data.cursor.y + 12; }
                        });
                        yPos = doc.lastAutoTable.finalY + 12;
                    });
                };

                renderSections(state.shared, "Train (Shared) Checks");
                LatData.ROTORS.forEach(r => {
                    doc.addPage(); yPos = 20;
                    renderSections(state.rotors[r.key].sections, r.label);
                });

                doc.save(`LVA_Review_${state.project.project || "Report"}.pdf`);
            };

            const exportExcel = () => {
                const projectData = [
                    { Field: "End Customer", Value: state.project.endCustomer },
                    { Field: "Project Name", Value: state.project.project },
                    { Field: "Configuration", Value: state.project.configuration },
                    { Field: "Review Date", Value: new Date().toLocaleString() }
                ];
                const criteriaRows = buildCriteriaSummary().map(([Rotor, Check, Result, Verdict]) => ({ Rotor, Check, Result, Verdict }));
                const flattened = [];
                Object.values(state.shared).forEach(sec => sec.items.forEach(it => flattened.push({
                    Rotor: "Train (Shared)", Section: sec.title, Category: it.category, Item: it.label, Requirement: it.requirement, Status: it.status.toUpperCase(), Notes: it.notes
                })));
                LatData.ROTORS.forEach(r => Object.values(state.rotors[r.key].sections).forEach(sec => sec.items.forEach(it => flattened.push({
                    Rotor: r.label, Section: sec.title, Category: it.category, Item: it.label, Requirement: it.requirement, Status: it.status.toUpperCase(), Notes: it.notes
                }))));

                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(projectData), "Info");
                XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(criteriaRows), "Criteria");
                XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(flattened), "Checklist");
                XLSX.writeFile(wb, `LVA_Review_${state.project.project || "Data"}.xlsx`);
            };

            // --- SEARCH (spans shared + every rotor) ---
            const getSearchResults = () => {
                if (!searchQuery.trim()) return null;
                const terms = searchQuery.toLowerCase().split(/\s+/).filter(t => t.length > 0);
                const results = [];
                const scan = (rotorLabel, rotorKey, sectionsObj) => {
                    Object.entries(sectionsObj).forEach(([secKey, section]) => {
                        const matches = section.items.filter(item => {
                            const text = `${item.label} ${item.requirement} ${item.insight} ${item.category} ${item.notes || ""}`.toLowerCase();
                            return terms.every(t => text.includes(t));
                        });
                        if (matches.length) results.push({ ...section, items: matches, rotorLabel, rotorKey, sectionKey: secKey });
                    });
                };
                scan("Train (Shared)", "shared", state.shared);
                LatData.ROTORS.forEach(r => scan(r.label, r.key, state.rotors[r.key].sections));
                return results;
            };
            const searchResults = getSearchResults();

            // --- ADD SECTION / ADD ITEM ---
            const handleAddSection = (e) => {
                e.preventDefault();
                const newId = `custom_${Date.now()}`;
                const newSection = { id: newId, title: newSectionData.title, iconKey: newSectionData.iconKey, isCustom: true, items: [] };
                setState(prev => {
                    const next = JSON.parse(JSON.stringify(prev));
                    if (activeRotor === "shared") next.shared[newId] = newSection;
                    else next.rotors[activeRotor].sections[newId] = newSection;
                    return next;
                });
                setActiveSection(newId);
                setIsSectionModalOpen(false);
            };
            const handleAddItem = (e) => {
                e.preventDefault();
                setState(prev => {
                    const next = JSON.parse(JSON.stringify(prev));
                    const bucket = activeRotor === "shared" ? next.shared : next.rotors[activeRotor].sections;
                    bucket[activeSection].items.push({
                        id: `item_${Date.now()}`, category: newItemData.category || "General", label: newItemData.label,
                        requirement: newItemData.requirement, insight: newItemData.insight, checked: false, status: "pending", notes: "", isCustom: true
                    });
                    return next;
                });
                setIsItemModalOpen(false);
            };

            const ActiveIcon = Icons[currentSections[activeSection]?.iconKey || "Shield"];

            return (
                <div className="p-6 max-w-7xl mx-auto">
                    <input type="file" ref={fileInputRef} onChange={handleImportFile} className="hidden" accept=".json" />

                    {/* Header */}
                    <header className="mb-6 bg-white rounded-xl shadow-sm border border-slate-200 p-6 no-print">
                        <div className="flex flex-col gap-4">
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <div>
                                    <div className="flex items-center gap-2">
                                        <a href="index.html" className="text-slate-400 hover:text-blue-600 transition-colors text-sm font-medium">← Dashboard</a>
                                        <span className="text-slate-300">/</span>
                                        <h1 className="text-2xl font-bold text-slate-900">Lateral Vibration Analysis Review</h1>
                                    </div>
                                    <div className="flex items-center gap-2 mt-1">
                                        <p className="text-slate-500 text-sm">API 617 / API 684 — Cloud Synced Tool</p>
                                        {saving ?
                                            <span className="text-xs bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full flex items-center gap-1"><span className="animate-pulse">●</span> Saving...</span> :
                                            <span className="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded-full">● Saved</span>
                                        }
                                    </div>
                                </div>
                                <div className="relative w-full md:w-96 group">
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 group-focus-within:text-blue-500"><Icons.Search /></div>
                                    <input type="text" className="block w-full pl-10 pr-10 py-2 border border-slate-300 rounded-lg leading-5 bg-slate-50 placeholder-slate-400 focus:outline-none focus:bg-white focus:ring-2 focus:ring-blue-500 transition-all shadow-sm sm:text-sm"
                                        placeholder="Search across all rotors..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} />
                                    {searchQuery && (
                                        <button onClick={() => setSearchQuery("")} className="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600"><Icons.X /></button>
                                    )}
                                </div>
                            </div>
                            <div className="flex flex-col md:flex-row justify-end items-center gap-4 pt-2 border-t border-slate-100 mt-2">
                                <div className="flex flex-wrap items-center gap-2 justify-end w-full">
                                    <button onClick={handleImportClick} className="flex items-center gap-1 px-3 py-1.5 text-xs font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors border border-slate-200"><Icons.Upload />Import</button>
                                    <button onClick={exportJSON} className="flex items-center gap-1 px-3 py-1.5 text-xs font-medium text-blue-700 bg-blue-50 hover:bg-blue-100 rounded-lg transition-colors border border-blue-200"><Icons.Download />Backup</button>
                                    <button onClick={resetData} className="flex items-center gap-1 px-3 py-1.5 text-xs font-medium text-red-600 bg-red-50 hover:bg-red-100 rounded-lg transition-colors border border-red-200"><Icons.RotateCcw />Reset</button>
                                    <div className="h-6 w-px bg-slate-200 mx-1 hidden md:block"></div>
                                    <button onClick={() => window.print()} className="flex items-center gap-1 px-3 py-1.5 text-xs font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors border border-slate-200"><Icons.Printer />Print</button>
                                    <button onClick={exportExcel} className="flex items-center gap-1 px-3 py-1.5 text-xs font-medium text-green-700 bg-green-50 hover:bg-green-100 rounded-lg transition-colors border border-green-200"><Icons.Table />Excel</button>
                                    <button onClick={exportPDF} className="flex items-center gap-1 px-3 py-1.5 text-xs font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors shadow-sm"><Icons.FileText />PDF Report</button>
                                </div>
                                <div className="flex items-center gap-3 w-full md:w-auto min-w-[200px] justify-end">
                                    <span className="text-xs font-bold text-slate-500 whitespace-nowrap">{progress}% Reviewed</span>
                                    <div className="w-32 h-2 bg-slate-100 rounded-full overflow-hidden flex-shrink-0"><div className="h-full bg-blue-600 transition-all duration-500" style={{ width: `${progress}%` }}></div></div>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Project Info */}
                    {!searchQuery && (
                        <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-6">
                            <h3 className="text-sm font-bold text-slate-800 uppercase tracking-wide mb-4 border-b border-slate-100 pb-2 flex items-center gap-2"><Icons.Info />Project Details</h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                {["endCustomer", "project", "manufacturer", "model", "specifications", "service"].map(field => (
                                    <div key={field}>
                                        <label className="block text-xs font-medium text-slate-500 mb-1 capitalize">{field.replace(/([A-Z])/g, " $1").trim()}</label>
                                        <input type="text" value={state.project[field]}
                                            onChange={(e) => setState(prev => ({ ...prev, project: { ...prev.project, [field]: e.target.value } }))}
                                            className="w-full text-sm p-2 border border-slate-300 rounded focus:ring-1 focus:ring-blue-500 outline-none" />
                                    </div>
                                ))}
                                <div className="lg:col-span-3">
                                    <label className="block text-xs font-medium text-slate-500 mb-1">Train Configuration</label>
                                    <input type="text" readOnly value={state.project.configuration} className="w-full text-sm p-2 border border-slate-200 rounded bg-slate-50 text-slate-500" />
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Rotor Selector */}
                    {!searchQuery && (
                        <div className="flex flex-wrap gap-2 mb-4 no-print">
                            {rotorTabs.map(tab => (
                                <button key={tab.key} onClick={() => selectRotor(tab.key)}
                                    className={`px-4 py-2 rounded-lg text-sm font-semibold border transition-colors ${activeRotor === tab.key ? "bg-blue-600 text-white border-blue-600 shadow-md" : "bg-white text-slate-600 border-slate-200 hover:bg-slate-100"}`}>
                                    {tab.label}
                                </button>
                            ))}
                        </div>
                    )}

                    {/* Main Content Grid */}
                    <div className="grid grid-cols-1 lg:grid-cols-4 gap-6">
                        {/* Sidebar */}
                        <nav className="lg:col-span-1 space-y-2 no-print">
                            {Object.entries(currentSections).map(([key, section]) => {
                                const SectionIcon = Icons[section.iconKey] || Icons.Shield;
                                return (
                                    <button key={key} onClick={() => { setActiveSection(key); setSearchQuery(""); }}
                                        className={`w-full flex items-center gap-3 p-3 rounded-lg text-left transition-colors ${activeSection === key && !searchQuery ? "bg-blue-600 text-white shadow-md" : "bg-white text-slate-600 hover:bg-slate-100 border border-transparent hover:border-slate-200"}`}>
                                        <SectionIcon /><span className="font-medium text-sm">{section.title}</span>
                                    </button>
                                );
                            })}
                            <button onClick={() => setIsSectionModalOpen(true)} className="w-full py-3 mt-4 text-sm text-slate-500 border-2 border-dashed border-slate-300 rounded-lg hover:border-blue-400 hover:text-blue-500 transition-colors">+ Add Section</button>

                            <div className="mt-8 p-4 bg-amber-50 rounded-lg border border-amber-100 shadow-sm">
                                <h3 className="text-sm font-bold text-amber-800 mb-2 flex items-center gap-2"><Icons.AlertTriangle />Critical Reminder</h3>
                                <p className="text-xs text-amber-700 leading-relaxed">
                                    <strong>Separation Margins:</strong> a critical speed failing its required SM, even by a small amount, is a genuine non-compliance — API 617 8th Ed 6.8.2.5.
                                </p>
                            </div>
                        </nav>

                        {/* Content */}
                        <div className="lg:col-span-3 bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                            {searchQuery ? (
                                <div>
                                    <div className="p-4 bg-blue-50 border-b border-blue-100">
                                        <h2 className="font-bold text-blue-900">Found {searchResults.reduce((acc, c) => acc + c.items.length, 0)} matches</h2>
                                    </div>
                                    {searchResults.map(section => (
                                        <div key={section.rotorKey + "-" + section.id} className="border-b border-slate-100 last:border-0">
                                            <div className="px-6 py-2 bg-slate-50 text-xs font-bold text-slate-500 uppercase tracking-wider">Found in: {section.rotorLabel} › {section.title}</div>
                                            {section.items.map(item => (
                                                <ItemCard key={item.id} item={item}
                                                    onCheck={() => handleCheck(section.rotorKey, section.sectionKey, item.id)}
                                                    onStatusChange={(v) => handleStatusChange(section.rotorKey, section.sectionKey, item.id, v)}
                                                    onNoteChange={(v) => handleNoteChange(section.rotorKey, section.sectionKey, item.id, v)} />
                                            ))}
                                        </div>
                                    ))}
                                    {searchResults.length === 0 && <div className="p-8 text-center text-slate-400">No matches.</div>}
                                </div>
                            ) : (
                                <>
                                    <div className="p-6 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center no-print">
                                        <h2 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                                            <ActiveIcon /> {currentSections[activeSection]?.title}
                                            {activeRotor !== "shared" && <span className="text-sm font-normal text-slate-400">— {state.rotors[activeRotor].label}</span>}
                                        </h2>
                                        <button onClick={() => setIsItemModalOpen(true)} className="px-3 py-1.5 text-xs font-bold text-white bg-blue-600 hover:bg-blue-700 rounded shadow-sm">+ Add Item</button>
                                    </div>

                                    {/* Shared scope panels — always mounted so Print can reveal all of them */}
                                    {Object.entries(state.shared).map(([secKey, section]) => (
                                        <div key={"shared-" + secKey} className={`scope-panel ${activeRotor === "shared" && activeSection === secKey ? "active" : ""}`}>
                                            <div className="hidden print:block px-6 pt-6 pb-2 print-rotor-heading">
                                                <h2 className="text-lg font-bold text-slate-800">Train (Shared) — {section.title}</h2>
                                            </div>
                                            <div className="divide-y divide-slate-100">
                                                {section.items.map(item => (
                                                    <ItemCard key={item.id} item={item}
                                                        onCheck={() => handleCheck("shared", secKey, item.id)}
                                                        onStatusChange={(v) => handleStatusChange("shared", secKey, item.id, v)}
                                                        onNoteChange={(v) => handleNoteChange("shared", secKey, item.id, v)} />
                                                ))}
                                                {section.items.length === 0 && <div className="p-8 text-center text-slate-400">No items yet.</div>}
                                            </div>
                                        </div>
                                    ))}

                                    {/* Per-rotor scope panels — always mounted so Print can reveal all of them */}
                                    {LatData.ROTORS.map(r => (
                                        <React.Fragment key={"rotor-" + r.key}>
                                            {Object.entries(state.rotors[r.key].sections).map(([secKey, section]) => (
                                                <div key={r.key + "-" + secKey} className={`scope-panel ${activeRotor === r.key && activeSection === secKey ? "active" : ""}`}>
                                                    <div className="hidden print:block px-6 pt-6 pb-2 print-rotor-heading">
                                                        <h2 className="text-lg font-bold text-slate-800">{r.label} — {section.title}</h2>
                                                    </div>
                                                    <div className="px-6 pt-4">
                                                        <CriteriaPanel rotorTemplate={r.template} sectionKey={secKey} calc={state.rotors[r.key].calc}
                                                            onCalcChange={(group, value) => handleCalcChange(r.key, group, value)} />
                                                    </div>
                                                    <div className="divide-y divide-slate-100">
                                                        {section.items.map(item => (
                                                            <ItemCard key={item.id} item={item}
                                                                onCheck={() => handleCheck(r.key, secKey, item.id)}
                                                                onStatusChange={(v) => handleStatusChange(r.key, secKey, item.id, v)}
                                                                onNoteChange={(v) => handleNoteChange(r.key, secKey, item.id, v)} />
                                                        ))}
                                                        {section.items.length === 0 && <div className="p-8 text-center text-slate-400">No items yet.</div>}
                                                    </div>
                                                </div>
                                            ))}
                                        </React.Fragment>
                                    ))}
                                </>
                            )}
                        </div>
                    </div>

                    {/* Add Section Modal */}
                    <Modal isOpen={isSectionModalOpen} onClose={() => setIsSectionModalOpen(false)} title="New Section">
                        <form onSubmit={handleAddSection} className="space-y-4">
                            <input autoFocus type="text" placeholder="Section Title" required className="w-full p-2 border rounded" value={newSectionData.title} onChange={e => setNewSectionData({ ...newSectionData, title: e.target.value })} />
                            <div className="flex justify-end gap-2 pt-2">
                                <button type="button" onClick={() => setIsSectionModalOpen(false)} className="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded">Cancel</button>
                                <button type="submit" className="px-4 py-2 text-sm bg-blue-600 text-white rounded hover:bg-blue-700">Create</button>
                            </div>
                        </form>
                    </Modal>

                    {/* Add Item Modal */}
                    <Modal isOpen={isItemModalOpen} onClose={() => setIsItemModalOpen(false)} title="New Check Point">
                        <form onSubmit={handleAddItem} className="space-y-3">
                            <input autoFocus type="text" placeholder="Label (e.g. Seal Clearance Check)" required className="w-full p-2 border rounded" value={newItemData.label} onChange={e => setNewItemData({ ...newItemData, label: e.target.value })} />
                            <input type="text" placeholder="Category (e.g. General)" className="w-full p-2 border rounded" value={newItemData.category} onChange={e => setNewItemData({ ...newItemData, category: e.target.value })} />
                            <textarea placeholder="Requirement" required className="w-full p-2 border rounded" value={newItemData.requirement} onChange={e => setNewItemData({ ...newItemData, requirement: e.target.value })} />
                            <div className="flex justify-end gap-2 pt-2">
                                <button type="button" onClick={() => setIsItemModalOpen(false)} className="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded">Cancel</button>
                                <button type="submit" className="px-4 py-2 text-sm bg-blue-600 text-white rounded hover:bg-blue-700">Add</button>
                            </div>
                        </form>
                    </Modal>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<LVAReviewTool />);
    </script>
