name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      # everything Firebase serves — html, app-core.js, firebase-config.js and
      # anything added later. Pushes that only touch README or the workflows
      # themselves still skip the deploy.
      - 'public/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --project my-app-hub-69db8 --token "$FIREBASE_TOKEN"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
